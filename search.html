<script>
var $=function(i){return document.getElementById(i)};
function tm(s){var d=new Date(s);return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function isNew(s){return Date.now()-new Date(s).getTime()<3*86400000}
function hpRow(h,extra){return '<a class="hrow" href="hp.html?id='+DB.esc(h.hp_id)+'">'+(h.icon&&h.icon.indexOf(DB.imgBase)===0?'<img src="'+DB.esc(h.icon)+'" alt="">':'<span class="noimg">♡</span>')+'<span><b>'+DB.esc(h.title||h.nickname+'のﾎﾑﾍﾟ')+'</b><br><small>by '+DB.esc(h.nickname)+(extra||'')+'</small>'+(h.tags&&h.tags.length?'<br><small class="tg">'+h.tags.map(function(t){return '#'+DB.esc(t)}).join(' ')+'</small>':'')+'</span></a>'}
async function roulette(){try{var id=await DB.randomHp();if(id)location.href='hp.html?id='+id;else alert('まだﾎﾑﾍﾟがないみたい')}catch(e){alert(e.message)}}

var P=new URLSearchParams(location.search),Q=P.get('q')||'',TAG=P.get('tag')||'',MODE=P.get('mode')==='rank'?'rank':'new';
$('q').value=Q;
$('tags').innerHTML=DB.TAGS.map(function(t){return '<a href="#" data-t="'+DB.esc(t)+'"'+(t===TAG?' class="on"':'')+'>#'+DB.esc(t)+'</a>'}).join('');
$('tags').onclick=function(e){var a=e.target.closest('[data-t]');if(!a)return;e.preventDefault();TAG=TAG===a.getAttribute('data-t')?'':a.getAttribute('data-t');
  $('tags').querySelectorAll('a').forEach(function(x){x.className=x.getAttribute('data-t')===TAG?'on':''});load()};
function tab(m){MODE=m;$('t-new').setAttribute('aria-selected',m==='new');$('t-rank').setAttribute('aria-selected',m==='rank');load()}
$('t-new').onclick=function(){tab('new')};$('t-rank').onclick=function(){tab('rank')};
$('go').onclick=function(){Q=$('q').value.trim();load()};$('q').onkeydown=function(e){if(e.key==='Enter'){Q=this.value.trim();load()}};
$('rl').onclick=roulette;
async function load(){$('res').innerHTML='<p class="msg">読み込み中…</p>';
  $('cap').textContent=(Q?'「'+Q+'」':'')+(TAG?' #'+TAG:'')+(MODE==='rank'?' ﾗﾝｷﾝｸﾞ（30日の拍手数）':' 新着順');
  try{var L=await DB.hpList(Q||TAG?(MODE==='rank'?'rank':'search'):MODE,Q,TAG,50);
    $('res').innerHTML=L.length?L.map(function(h,i){return (MODE==='rank'?'<span class="rk">'+(i+1)+'位</span>':'')+hpRow(h,MODE==='rank'?' ／ 👏'+h.claps:'')}).join(''):'<p class="msg">見つからなかったょ(´・ω・`)</p>'}
  catch(e){$('res').innerHTML='<p class="msg ng">'+DB.esc(e.message)+'</p>'}}
tab(MODE);
</script>
