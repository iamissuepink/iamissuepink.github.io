<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>☆★あやねのﾌﾟﾛﾌ★☆</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ffd6ea;--pat:#ffb8d9;--card:#fff;--ink:#6b1f45;--hi:#ff3d9a;--hi2:#ff8cc6;--sub:#ffc1df;--line:#ffb3d6;--title2:#fff;--frame:#fff0f7;--glit:#ffffff,#ff7ac1,#ffe066}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-skin="pink"]{--bg:#2a0618;--pat:#4a0c2c;--card:#1c0410;--ink:#ffd3e9;--hi:#ff4fa8;--hi2:#c2397f;--sub:#6b1f45;--line:#6b1f45;--title2:#1c0410;--frame:#33091f}}
:root[data-theme="dark"][data-skin="pink"]{--bg:#2a0618;--pat:#4a0c2c;--card:#1c0410;--ink:#ffd3e9;--hi:#ff4fa8;--hi2:#c2397f;--sub:#6b1f45;--line:#6b1f45;--title2:#1c0410;--frame:#33091f}
:root[data-skin="gal"]{--bg:#000;--pat:#24001a;--card:#0b0006;--ink:#ffe3f1;--hi:#ff2e97;--hi2:#ff86c4;--sub:#d4a017;--line:#4a2238;--title2:#000;--frame:#1a0010;--glit:#ffd700,#ff4fa8,#ffffff}
:root[data-skin="mizu"]{--bg:#d4f1ff;--pat:#a8e2fb;--card:#fff;--ink:#164a66;--hi:#1ea7e6;--hi2:#7fd3f5;--sub:#c4ecfc;--line:#9fd9f3;--title2:#fff;--frame:#effaff;--glit:#ffffff,#7fd3f5,#d0b3ff}
:root[data-skin="lemon"]{--bg:#fffbd1;--pat:#fff08a;--card:#fff;--ink:#5c4a00;--hi:#ff9500;--hi2:#ffc766;--sub:#d6f5a8;--line:#f2df70;--title2:#fff;--frame:#fffde8;--glit:#ffffff,#ffd000,#9be36b}
:root[data-skin="yume"]{--bg:#f3e8ff;--pat:#ffd9f2;--card:#fff;--ink:#4a2a6b;--hi:#b45cff;--hi2:#e3a3ff;--sub:#bfeaff;--line:#dcc4f5;--title2:#fff;--frame:#fbf5ff;--glit:#ff8fd0,#8fd8ff,#fff27a,#b0ff9e}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;color:var(--ink);background-color:var(--bg);
background-image:radial-gradient(circle at 25% 25%,var(--pat) 3px,transparent 3.5px),radial-gradient(circle at 75% 75%,var(--pat) 3px,transparent 3.5px);background-size:22px 22px;
font-family:"MS PGothic","ＭＳ Ｐゴシック","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:13px;line-height:1.6}
#kira{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.phone{max-width:380px;margin:14px auto 80px;background:var(--frame);border-radius:30px;padding:10px 10px 20px;box-shadow:0 0 0 3px var(--hi2),0 7px 0 var(--hi)}
.screen{border:3px solid transparent;border-radius:8px;overflow:hidden;
background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(90deg,var(--hi),#ffe066,var(--hi2),#9be3ff,var(--hi)) border-box;
background-size:100% 100%,200% 100%;animation:fr 4s linear infinite}
@keyframes fr{to{background-position:0 0,200% 0}}
@media (max-width:420px){.phone{max-width:none;margin:0 0 80px;border-radius:0;padding:0;box-shadow:none;background:none}.screen{border-radius:0;border-width:0 0 3px}}
.sb{display:flex;justify-content:space-between;background:linear-gradient(var(--hi2),var(--hi));color:#fff;font-size:11px;padding:2px 6px;font-family:"Courier New",monospace}
.in{padding:8px 10px 16px}
h1{margin:8px 0 4px;text-align:center;font-size:23px;line-height:1.3;letter-spacing:.04em;
background:linear-gradient(90deg,#ff5fa2,#ffb347,#ffe94d,#74f0a0,#6ec8ff,#b98bff,#ff5fa2);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(1px 0 0 var(--title2)) drop-shadow(-1px 0 0 var(--title2)) drop-shadow(0 1px 0 var(--title2)) drop-shadow(0 -1px 0 var(--title2)) drop-shadow(2px 2px 0 var(--hi));animation:sh 3s linear infinite}
@keyframes sh{to{background-position:200% center}}
.tw{color:#ffd700;display:inline-block;animation:tw 1.4s ease-in-out infinite}
.tw.b{animation-delay:.7s;color:var(--hi2)}
@keyframes tw{50%{transform:scale(.5) rotate(45deg);opacity:.3}}
.marq{overflow:hidden;white-space:nowrap;background:linear-gradient(90deg,var(--hi),var(--hi2),var(--hi));color:#fff;font-size:12px;margin:6px -10px;text-shadow:0 0 3px rgba(0,0,0,.25)}
.marq span{display:inline-block;padding:2px 0 2px 100%;animation:mq 16s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.pic{display:block;margin:10px auto 4px;max-width:180px;width:70%;border:3px solid var(--hi2);outline:2px dotted #ffd700;outline-offset:3px;border-radius:6px}
.hito{text-align:center;margin:8px 0}
.cnt{text-align:center;font-size:11px;margin:8px 0}
.cnt b{font-family:"Courier New",monospace;background:#000;color:#39ff6a;padding:1px 4px;letter-spacing:3px;border:1px solid #555;text-shadow:0 0 4px #39ff6a}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 4px}
.menu a{position:relative;overflow:hidden;display:block;text-align:center;color:#fff;text-decoration:none;font-weight:bold;
background:linear-gradient(var(--hi2),var(--hi));border-radius:999px;padding:6px 2px;box-shadow:0 3px 0 color-mix(in srgb,var(--hi) 60%,#000);text-shadow:0 1px 1px rgba(0,0,0,.25)}
.menu a::before{content:"";position:absolute;left:8%;right:8%;top:2px;height:45%;border-radius:999px;background:rgba(255,255,255,.5)}
.menu a:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--hi) 60%,#000)}
.menu a.w{grid-column:1/-1}
.ttl{margin:14px 0 8px;text-align:center;color:#fff;font-weight:bold;font-size:14px;border-radius:12px;padding:3px;
background:linear-gradient(90deg,var(--hi),var(--hi2),var(--hi));background-size:200% 100%;animation:fr 3s linear infinite;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.ttl::before,.ttl::after{content:"✧･ﾟ";color:#fff6a8}
.ttl::after{content:"ﾟ･✧"}
.dv{text-align:center;color:var(--hi2);letter-spacing:-1px;overflow:hidden;white-space:nowrap;margin:10px 0;font-size:12px}
dl{margin:0}
dt{color:var(--hi);font-weight:bold;margin-top:7px}
dt::before{content:"♡";margin-right:3px;color:var(--hi2)}
dd{margin:0 0 0 1.1em;padding:1px 0 4px;border-bottom:1px dotted var(--line);word-break:break-all;min-height:1.5em}
.ent{border-left:3px solid var(--hi2);padding:2px 0 2px 8px;margin:10px 0}
.ent .d{color:var(--hi);font-size:11px;font-weight:bold}
.bl{display:block;text-decoration:none;color:var(--ink);border-bottom:1px dotted var(--line);padding:6px 2px}
.bl .d{color:var(--hi);font-size:11px;font-weight:bold}
.bl .t{font-weight:bold}
.art h2{font-size:16px;margin:4px 0;color:var(--hi);text-align:center}
.art .d{text-align:center;font-size:11px;opacity:.8}
.art .bd{margin:12px 0;word-break:break-all}
.pn{display:flex;justify-content:space-between;font-size:12px;margin-top:12px}
.pn a,.back a,.lk a,.more a{color:var(--hi)}
.hist{margin:0;padding:0;list-style:none}
.hist li{border-bottom:1px dotted var(--line);padding:3px 0}
.new{color:#ff1f1f;font-weight:bold;font-size:10px;animation:bl .8s steps(1) infinite;margin-left:4px}
@keyframes bl{50%{opacity:0}}
.empty{text-align:center;font-size:11px;opacity:.6}
.back{text-align:center;margin-top:18px;font-size:12px}
.more{text-align:right;font-size:11px;margin:4px 0 0}
.foot{text-align:center;font-size:11px;margin-top:16px;opacity:.85}
@media (prefers-reduced-motion:reduce){.marq span,.tw,.new,h1,.screen,.ttl{animation:none}.marq span{padding-left:6px}}
a:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
</style>
</head>
<body>
<div id="root"></div>
<canvas id="kira" aria-hidden="true"></canvas>
<script id="state" type="application/json">{"skin": "gal", "title": "☆★あやねのﾌﾟﾛﾌ★☆", "marquee": "ようこそ(*´∀`*)ﾉﾞ ゆっくりしてってね☆ 荒らし・ﾁｪｰﾝ禁止!! ﾏｲﾍﾟｰｽ更新中ﾃﾞｽ…", "hitokoto": "ﾌﾟﾛﾌ作ってみた(o´∀`o)\nﾖﾛｼｸﾈ♪", "counter": "114514", "img": "", "qa": [["名前", "あやね"], ["ﾆｯｸﾈｰﾑ", "あやﾋﾟｮﾝo(^-^)o"], ["誕生日", "11月5日\nｲｲｺの日~"], ["星座", "さそり座のｳｫﾝﾅ"], ["血液型", "ABがた"], ["住み", "大宮区三橋"], ["部活", "ない"], ["MBTI", "ESFP"], ["長所", "湯けむり横丁で頑張って働いていること"], ["短所", "パレスホテル大宮を辞めた"], ["ﾁｬｰﾑﾎﾟｲﾝﾄ", "前歯"], ["好きな色", "rainbow"], ["好きな食べ物", "うに\n牡蠣"], ["嫌いな食べ物", "茄子"], ["ﾏｲﾌﾞｰﾑ", "湯けむり横丁"], ["宝物", "お前♡"], ["将来の夢", "湯けむり横丁に就職"], ["最後に一言", "見てくれてｱﾘｶﾞﾄ(*´ω｀*)"]], "real": [{"d": "10/3", "t": "今日は湯けむり横丁で働いてきたよ(ᵔᴥᵔ)"}], "hist": [{"d": "", "t": "ﾌﾟﾛﾌ開設しました♪みんなよろしく♡"}], "links": [], "since": "Since 2026 ／ ﾘﾝｸﾌﾘｰ ／ 無断転載禁止", "blog": []}</script>
<script>
(function(){
var root=document.getElementById('root');
var S=JSON.parse(document.getElementById('state').textContent);
function fix(s){['qa','real','hist','links','blog'].forEach(function(k){if(!Array.isArray(s[k]))s[k]=[]});return s}
fix(S);
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nl(x){return esc(x).replace(/\n/g,'<br>')}
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\/[^\s"'<>]+$/i.test(u)?u:''}
function clock(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
var DV='☆.｡.:*・°☆.｡.:*・°☆.｡.:*・°☆.｡.:*・°☆';
function ttl(t){return '<p class="ttl">'+t+'</p>'}
function back(){return '<p class="back"><a href="#">◀ TOPへもどる</a></p>'}
function frame(inner){return '<div class="phone"><div class="screen"><div class="sb" aria-hidden="true"><span>📶 ﾊﾞﾘ3</span><span id="clk">'+clock()+'</span><span>🔋▮▮▮</span></div><div class="in">'+inner+'</div></div></div>'}
function top(s){
  var h='<h1><span class="tw">✦</span>'+esc(s.title)+'<span class="tw b">✦</span></h1>';
  if(s.marquee)h+='<div class="marq"><span>'+esc(s.marquee)+'</span></div>';
  if(s.img)h+='<img class="pic" src="'+esc(s.img)+'" alt="ﾌﾟﾛﾌ画像">';
  if(s.hitokoto)h+='<p class="hito">'+nl(s.hitokoto)+'</p>';
  if(s.counter)h+='<p class="cnt">あなたは <b>'+esc(s.counter)+'</b> 人目のお客様です♪</p>';
  h+='<div class="dv" aria-hidden="true">'+DV+'</div>';
  h+='<nav class="menu"><a href="#prof">♡ﾌﾟﾛﾌ♡</a><a href="#blog">♡ﾌﾞﾛｸﾞ♡</a><a href="#real">♡ﾘｱﾙ♡</a><a href="#hist">♡更新履歴♡</a><a class="w" href="#link">♡ﾘﾝｸ♡</a></nav>';
  if(s.blog.length){var b=s.blog[0];h+=ttl('最新ﾌﾞﾛｸﾞ')+'<a class="bl" href="#b-'+esc(b.id)+'"><span class="d">'+esc(b.d)+'</span> <span class="t">'+esc(b.t||'無題')+'</span><span class="new">NEW!</span></a>'}
  if(s.hist.length){var e=s.hist[0];h+=ttl('更新')+'<p style="margin:0;text-align:center">'+(e.d?esc(e.d)+' ':'')+esc(e.t)+'</p>'}
  h+='<p class="foot">'+esc(s.since)+'</p>';
  return h;
}
function prof(s){var h=ttl('ﾌﾟﾛﾌ')+'<dl>';s.qa.forEach(function(p){h+='<dt>'+esc(p[0])+'</dt><dd>'+nl(p[1])+'</dd>'});return h+'</dl>'+back()}
function real(s){var h=ttl('ﾘｱﾙ');if(!s.real.length)h+='<p class="empty">まだﾘｱﾙはありません</p>';s.real.forEach(function(e){h+='<div class="ent"><div class="d">'+esc(e.d)+'</div>'+nl(e.t)+'</div>'});return h+back()}
function blog(s){var h=ttl('ﾌﾞﾛｸﾞ');if(!s.blog.length)h+='<p class="empty">まだ記事はありません</p>';s.blog.forEach(function(b,i){h+='<a class="bl" href="#b-'+esc(b.id)+'"><span class="d">'+esc(b.d)+'</span> <span class="t">'+esc(b.t||'無題')+'</span>'+(i===0?'<span class="new">NEW!</span>':'')+'</a>'});return h+back()}
function art(s,id){
  var i=-1;s.blog.forEach(function(b,k){if(String(b.id)===id)i=k});
  if(i<0)return ttl('ﾌﾞﾛｸﾞ')+'<p class="empty">この記事は見つかりませんでした</p><p class="back"><a href="#blog">◀ 記事一覧へ</a></p>';
  var b=s.blog[i],h=ttl('ﾌﾞﾛｸﾞ')+'<div class="art"><h2>'+esc(b.t||'無題')+'</h2><p class="d">'+esc(b.d)+'</p><div class="dv" aria-hidden="true">'+DV+'</div><div class="bd">'+nl(b.b)+'</div></div>';
  h+='<div class="pn"><span>'+(i<s.blog.length-1?'<a href="#b-'+esc(s.blog[i+1].id)+'">◀ 前の記事</a>':'')+'</span><span>'+(i>0?'<a href="#b-'+esc(s.blog[i-1].id)+'">次の記事 ▶</a>':'')+'</span></div>';
  return h+'<p class="back"><a href="#blog">記事一覧</a> ／ <a href="#">TOP</a></p>';
}
function hist(s){var h=ttl('更新履歴')+'<ul class="hist">';s.hist.forEach(function(e,i){h+='<li>'+(e.d?esc(e.d)+' ':'')+esc(e.t)+(i===0?'<span class="new">NEW!</span>':'')+'</li>'});return h+'</ul>'+back()}
function link(s){var h=ttl('ﾘﾝｸ');if(!s.links.length)h+='<p class="empty">ﾘﾝｸ募集中ﾃﾞｽ</p>';s.links.forEach(function(l){var u=safeUrl(l.u);h+='<p class="lk">▼'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(l.n||u)+'</a>':esc(l.n))+'</p>'});return h+back()}
function route(){
  var r=location.hash.replace(/^#/,''),s=S,inner;
  document.documentElement.dataset.skin=s.skin||'pink';
  document.title=s.title||'ﾌﾟﾛﾌ';
  if(r.indexOf('b-')===0)inner=art(s,decodeURIComponent(r.slice(2)));
  else inner=({prof:prof,real:real,blog:blog,hist:hist,link:link}[r]||top)(s);
  root.innerHTML=frame(inner);
  readGlit();
}
window.addEventListener('hashchange',function(){route();scrollTo(0,0)});
setInterval(function(){var c=document.getElementById('clk');if(c)c.textContent=clock()},30000);
window.HP={render:function(s){S=fix(s);route()},state:function(){return S}};

/* glitter */
var cv=document.getElementById('kira'),cx=cv.getContext('2d'),W=0,H=0,dpr=1,stars=[],parts=[],cols=['#fff'];
var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function readGlit(){var v=getComputedStyle(document.documentElement).getPropertyValue('--glit');if(v)cols=v.split(',').map(function(x){return x.trim()}).filter(Boolean)}
function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  stars=[];var n=Math.round(Math.min(46,W*H/9000));for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:2+Math.random()*4,p:Math.random()*6.28,s:.6+Math.random()*1.6,c:Math.floor(Math.random()*9)})}
function star(x,y,r,a,c){cx.globalAlpha=a;cx.fillStyle=c;cx.beginPath();cx.moveTo(x,y-r);cx.quadraticCurveTo(x,y,x+r,y);cx.quadraticCurveTo(x,y,x,y+r);cx.quadraticCurveTo(x,y,x-r,y);cx.quadraticCurveTo(x,y,x,y-r);cx.fill()}
function frameDraw(t){
  cx.clearRect(0,0,W,H);
  stars.forEach(function(s){var a=Math.max(0,Math.sin(s.p+t/1000*s.s));if(a>.05)star(s.x,s.y,s.r*(.4+a*.6),a*.85,cols[s.c%cols.length])});
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.l-=.022;if(p.l<=0){parts.splice(i,1);continue}star(p.x,p.y,p.r*p.l+1,p.l,p.c)}
  cx.globalAlpha=1;
  if(!document.hidden)requestAnimationFrame(frameDraw);
}
if(!still){
  size();readGlit();addEventListener('resize',size);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)requestAnimationFrame(frameDraw)});
  addEventListener('pointerdown',function(e){for(var i=0;i<10;i++){var a=Math.random()*6.28,v=1.5+Math.random()*3;parts.push({x:e.clientX,y:e.clientY,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,r:3+Math.random()*4,l:1,c:cols[i%cols.length]})}});
  requestAnimationFrame(frameDraw);
}
route();
})();
</script>
</body>
</html>
