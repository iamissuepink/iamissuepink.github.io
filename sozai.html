<script>
var $=function(i){return document.getElementById(i)};
function tm(s){var d=new Date(s);return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function isNew(s){return Date.now()-new Date(s).getTime()<3*86400000}
function hpRow(h,extra){return '<a class="hrow" href="hp.html?id='+DB.esc(h.hp_id)+'">'+(h.icon&&h.icon.indexOf(DB.imgBase)===0?'<img src="'+DB.esc(h.icon)+'" alt="">':'<span class="noimg">♡</span>')+'<span><b>'+DB.esc(h.title||h.nickname+'のﾎﾑﾍﾟ')+'</b><br><small>by '+DB.esc(h.nickname)+(extra||'')+'</small>'+(h.tags&&h.tags.length?'<br><small class="tg">'+h.tags.map(function(t){return '#'+DB.esc(t)}).join(' ')+'</small>':'')+'</span></a>'}
async function roulette(){try{var id=await DB.randomHp();if(id)location.href='hp.html?id='+id;else alert('まだﾎﾑﾍﾟがないみたい')}catch(e){alert(e.message)}}

var me=null;
async function load(){try{var L=await DB.materials(120);
  $('res').innerHTML=L.length?L.map(function(m){var p=m.profiles||{};return '<div class="scell"><div class="simg"><img src="'+DB.esc(DB.sozBase+m.path)+'" alt="'+DB.esc(m.title||'素材')+'"></div><b>'+DB.esc(m.title||'無題')+'</b><small>by '+(p.hp_id?'<a href="hp.html?id='+DB.esc(p.hp_id)+'">'+DB.esc(p.nickname)+'</a>':DB.esc(p.nickname||''))+'</small><button type="button" class="del" data-cp="'+DB.esc(m.path)+'">ｺｰﾄﾞをｺﾋﾟｰ</button>'+(me&&m.user_id===me.id?'<button type="button" class="del" data-rm="'+m.id+'" data-p="'+DB.esc(m.path)+'">削除</button>':'')+'</div>'}).join(''):'<p class="msg">まだ素材がないょ。一番乗りしてね♪</p>'}
  catch(e){$('res').innerHTML='<p class="msg ng">'+DB.esc(e.message)+'</p>'}}
$('res').onclick=async function(e){var c=e.target.getAttribute('data-cp'),r=e.target.getAttribute('data-rm');
  if(c){var code='[s='+c+']';try{await navigator.clipboard.writeText(code);e.target.textContent='ｺﾋﾟｰしたょ✧'}catch(err){prompt('このｺｰﾄﾞをｺﾋﾟｰしてね',code)}}
  else if(r){if(!confirm('この素材を削除する？（使ってるﾎﾑﾍﾟからも消えるょ）'))return;try{await DB.delMaterial(+r,e.target.getAttribute('data-p'));load()}catch(err){alert(err.message)}}};
$('sbtn').onclick=async function(){var b=this,m=$('smsg'),f=$('sf').files[0];
  if(!f){m.textContent='画像を選んでね';m.className='msg ng';return}
  if(!$('own').checked){m.textContent='自分で作った素材だけ置けるょ';m.className='msg ng';return}
  b.disabled=true;m.textContent='ｱｯﾌﾟﾛｰﾄﾞ中…';m.className='msg';
  try{await DB.addMaterial(me.id,f,$('st').value.trim());m.textContent='置いたょ✧';$('sf').value='';$('st').value='';$('own').checked=false;load()}catch(e){m.textContent=e.message;m.className='msg ng'}b.disabled=false};
DB.me().then(function(u){me=u;if(u)$('up').hidden=false;load()});
</script>
