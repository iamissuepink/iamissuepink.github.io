<script>
var $=function(i){return document.getElementById(i)},E=DB.esc;
var S=['おひつじ座','おうし座','ふたご座','かに座','しし座','おとめ座','てんびん座','さそり座','いて座','やぎ座','みずがめ座','うお座'];
var M=['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'];
var COL=['ﾋﾟﾝｸ','ﾚｯﾄﾞ','ｵﾚﾝｼﾞ','ｲｴﾛｰ','ﾐﾝﾄｸﾞﾘｰﾝ','水色','ﾈｲﾋﾞｰ','ﾗﾍﾞﾝﾀﾞｰ','ｺﾞｰﾙﾄﾞ','ｼﾙﾊﾞｰ','ﾎﾜｲﾄ','ﾌﾞﾗｯｸ','ﾋｮｳ柄','ﾚｲﾝﾎﾞｰ'];
var ITEM=['ﾌﾟﾘｸﾗ','ｹｰﾀｲのｽﾄﾗｯﾌﾟ','ｼｭｼｭ','ﾘｯﾌﾟｸﾞﾛｽ','ｷﾗｷﾗｼｰﾙ','手鏡','ﾍｱﾋﾟﾝ','ｲﾁｺﾞﾐﾙｸ','ﾁｮｺ','ﾃﾞｺったﾍﾟﾝ','ﾏｽｺｯﾄ','ｲﾔﾎﾝ','ﾊﾝﾄﾞｸﾘｰﾑ','ﾐｻﾝｶﾞ','ｶﾁｭｰｼｬ','ｷｬﾝﾃﾞｨ','ﾉｰﾄ','香水','ﾘﾎﾞﾝ','ｸﾞﾐ'];
var MSG=[
 ['ちょっとお休みﾓｰﾄﾞな日。無理しないで、早めに寝ちゃおう(-_-)zzz','空回りしやすいかも。深呼吸してから話すとｸﾞｯﾄﾞ!','うっかりﾐｽに注意!! 持ち物ﾁｪｯｸを忘れずにね'],
 ['いつもどおりが一番の日。小さなｲｲｺﾄを探してみて♪','友達の話をじっくり聞くと、ﾅｲｽな発見があるかも','ﾏｲﾍﾟｰｽでOK。焦らず自分のﾘｽﾞﾑで(´∀｀)'],
 ['なんだかﾂｲてる予感☆ 気になってたｺﾄに挑戦してみて!!','笑顔がﾁｬｰﾑﾎﾟｲﾝﾄ♡ まわりからの注目度UP!','ひらめきがさえる日。ﾒﾓしておくといいかも✧'],
 ['最強ﾗｯｷｰﾃﾞｰ!! 何をやってもうまくいきそう(ﾉ´∀｀*)ﾉ','うれしいﾆｭｰｽが届くかも♪ ｹｰﾀｲをﾁｪｯｸ!!','ｷﾗｷﾗ運MAX✧ 思いきって行動すると吉!!']];
function rnd(seed){var x=seed>>>0||1;return function(){x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296}}
function today(){var d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function fort(i){var r=rnd(today()*31+i*7919+17);for(var k=0;k<5;k++)r();
  var a={love:1+Math.floor(r()*5),money:1+Math.floor(r()*5),friend:1+Math.floor(r()*5),study:1+Math.floor(r()*5)};
  a.total=a.love+a.money+a.friend+a.study+r();a.col=COL[Math.floor(r()*COL.length)];a.item=ITEM[Math.floor(r()*ITEM.length)];return a}
var F=S.map(function(_,i){return fort(i)}),ORD=F.map(function(f,i){return i}).sort(function(a,b){return F[b].total-F[a].total});
function st(n){return '<span style="color:#ffe066">'+'★'.repeat(n)+'</span><span style="color:#555">'+'★'.repeat(5-n)+'</span>'}
function show(i){var f=F[i],rk=ORD.indexOf(i)+1,lv=rk<=3?3:rk<=6?2:rk<=9?1:0,r=rnd(today()+i*101);
  $('res').hidden=false;
  $('res').innerHTML='<h3>'+M[i]+' '+S[i]+' ｸﾝ…今日ゎ'+rk+'位!!</h3><p style="text-align:center">'+E(MSG[lv][Math.floor(r()*3)])+'</p>'+
   '<div class="li">恋愛運　'+st(f.love)+'</div><div class="li">金運　　'+st(f.money)+'</div><div class="li">友情運　'+st(f.friend)+'</div><div class="li">勉強運　'+st(f.study)+'</div>'+
   '<div class="li">ﾗｯｷｰｶﾗｰ　<b style="color:#ff9ad5">'+E(f.col)+'</b></div><div class="li">ﾗｯｷｰｱｲﾃﾑ　<b style="color:#9be3ff">'+E(f.item)+'</b></div>';
  history.replaceState(null,'','?s='+i);$('res').scrollIntoView({behavior:'smooth',block:'start'})}
$('signs').innerHTML=S.map(function(s,i){return '<a class="scell" href="?s='+i+'" data-s="'+i+'" style="text-decoration:none;color:#ffd6ec;min-height:44px"><span style="font-size:18px">'+M[i]+'</span>'+s+'</a>'}).join('');
$('signs').onclick=function(e){var a=e.target.closest('[data-s]');if(!a)return;e.preventDefault();show(+a.getAttribute('data-s'))};
$('rank').innerHTML=ORD.map(function(i,k){return '<div class="li"><span class="dg" style="color:#ffe066">'+(k+1)+'位</span> <a href="?s='+i+'" data-s="'+i+'">'+M[i]+' '+S[i]+'</a></div>'}).join('');
$('rank').onclick=$('signs').onclick;
var q=+new URLSearchParams(location.search).get('s');if(new URLSearchParams(location.search).has('s')&&q>=0&&q<12)show(q);
</script>
