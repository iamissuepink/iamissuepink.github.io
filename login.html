<script>
(function(){
var $=function(i){return document.getElementById(i)},msg=$('msg');
function say(t,ng){msg.textContent=t;msg.className='msg'+(ng?' ng':'')}
function tab(up){$('t-in').setAttribute('aria-selected',!up);$('t-up').setAttribute('aria-selected',up);$('f-in').hidden=up;$('f-up').hidden=!up;say('')}
$('t-in').onclick=function(){tab(false)};$('t-up').onclick=function(){tab(true)};
if(location.hash==='#signup')tab(true);
DB.me().then(function(u){if(u)location.href='mypage.html'});
$('b-in').onclick=async function(){var b=this;b.disabled=true;say('ﾛｸﾞｲﾝ中…');
  try{await DB.logIn($('in-mail').value.trim(),$('in-pass').value);location.href='mypage.html'}catch(e){say(e.message,true)}b.disabled=false};
$('b-up').onclick=async function(){var b=this,n=$('up-nick').value.trim();
  if(!n){say('ﾆｯｸﾈｰﾑを入れてね',true);return}
  b.disabled=true;say('登録中…');
  try{await DB.signUp($('up-mail').value.trim(),$('up-pass').value,n);say('確認ﾒｰﾙを送ったょ!! ﾒｰﾙのﾘﾝｸを押してね✉')}catch(e){say(e.message,true)}b.disabled=false};
})();</script>
