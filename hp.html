<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ﾎﾑﾍﾟ｜めろﾋﾟｮﾝ☆</title>
<style>
@font-face{font-family:"Jiskan16";src:url("/fonts/Jiskan16x2004-Regular.woff2") format("woff2");font-display:swap}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ffd6ea;--pat:#ffb8d9;--card:#fff;--ink:#6b1f45;--hi:#ff3d9a;--hi2:#ff8cc6;--sub:#ffc1df;--line:#ffb3d6;--title2:#fff;--frame:#fff0f7;--glit:#ffffff,#ff7ac1,#ffe066}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-skin="pink"]{--bg:#2a0618;--pat:#4a0c2c;--card:#1c0410;--ink:#ffd3e9;--hi:#ff4fa8;--hi2:#c2397f;--sub:#6b1f45;--line:#6b1f45;--title2:#1c0410;--frame:#33091f}}
:root[data-theme="dark"][data-skin="pink"]{--bg:#2a0618;--pat:#4a0c2c;--card:#1c0410;--ink:#ffd3e9;--hi:#ff4fa8;--hi2:#c2397f;--sub:#6b1f45;--line:#6b1f45;--title2:#1c0410;--frame:#33091f}
:root[data-skin="gal"]{--bg:#000;--pat:#24001a;--card:#0b0006;--ink:#ffe3f1;--hi:#ff2e97;--hi2:#ff86c4;--sub:#d4a017;--line:#4a2238;--title2:#000;--frame:#1a0010;--glit:#ffd700,#ff4fa8,#ffffff}
:root[data-skin="mizu"]{--bg:#d4f1ff;--pat:#a8e2fb;--card:#fff;--ink:#164a66;--hi:#1ea7e6;--hi2:#7fd3f5;--sub:#c4ecfc;--line:#9fd9f3;--title2:#fff;--frame:#effaff;--glit:#ffffff,#7fd3f5,#d0b3ff}
:root[data-skin="lemon"]{--bg:#fffbd1;--pat:#fff08a;--card:#fff;--ink:#5c4a00;--hi:#ff9500;--hi2:#ffc766;--sub:#d6f5a8;--line:#f2df70;--title2:#fff;--frame:#fffde8;--glit:#ffffff,#ffd000,#9be36b}
:root[data-skin="yume"]{--bg:#f3e8ff;--pat:#ffd9f2;--card:#fff;--ink:#4a2a6b;--hi:#b45cff;--hi2:#e3a3ff;--sub:#bfeaff;--line:#dcc4f5;--title2:#fff;--frame:#fbf5ff;--glit:#ff8fd0,#8fd8ff,#fff27a,#b0ff9e}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;color:var(--ink);background-color:var(--bg);
background-image:radial-gradient(circle at 25% 25%,var(--pat) 3px,transparent 3.5px),radial-gradient(circle at 75% 75%,var(--pat) 3px,transparent 3.5px);background-size:22px 22px;
font-family:"Jiskan16","MS PGothic","ＭＳ Ｐゴシック","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:13px;line-height:1.6}
#kira{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.phone{max-width:380px;margin:14px auto 80px;background:var(--frame);border-radius:30px;padding:10px 10px 20px;box-shadow:0 0 0 3px var(--hi2),0 7px 0 var(--hi)}
.screen{border:3px solid transparent;border-radius:8px;overflow:hidden;
background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(90deg,var(--hi),#ffe066,var(--hi2),#9be3ff,var(--hi)) border-box;
background-size:100% 100%,200% 100%;animation:fr 4s linear infinite}
@keyframes fr{to{background-position:0 0,200% 0}}
@media (max-width:420px){.phone{max-width:none;margin:0 0 80px;border-radius:0;padding:0;box-shadow:none;background:none}.screen{border-radius:0;border-width:0 0 3px}}
.sb{display:flex;justify-content:space-between;background:linear-gradient(var(--hi2),var(--hi));color:#fff;font-size:11px;padding:2px 6px;font-family:"Courier New",monospace}
.in{padding:8px 10px 16px}
h1{margin:8px 0 4px;text-align:center;font-size:23px;line-height:1.3;letter-spacing:.04em;
background:linear-gradient(90deg,#ff5fa2,#ffb347,#ffe94d,#74f0a0,#6ec8ff,#b98bff,#ff5fa2);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(1px 0 0 var(--title2)) drop-shadow(-1px 0 0 var(--title2)) drop-shadow(0 1px 0 var(--title2)) drop-shadow(0 -1px 0 var(--title2)) drop-shadow(2px 2px 0 var(--hi));animation:sh 3s linear infinite}
@keyframes sh{to{background-position:200% center}}
.tw{color:#ffd700;display:inline-block;animation:tw 1.4s ease-in-out infinite}
.tw.b{animation-delay:.7s;color:var(--hi2)}
@keyframes tw{50%{transform:scale(.5) rotate(45deg);opacity:.3}}
.marq{overflow:hidden;white-space:nowrap;background:linear-gradient(90deg,var(--hi),var(--hi2),var(--hi));color:#fff;font-size:12px;margin:6px -10px;text-shadow:0 0 3px rgba(0,0,0,.25)}
.marq span{display:inline-block;padding:2px 0 2px 100%;animation:mq 16s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.pic{display:block;margin:10px auto 4px;max-width:180px;width:70%;border:3px solid var(--hi2);outline:2px dotted #ffd700;outline-offset:3px;border-radius:6px}
.hito{text-align:center;margin:8px 0}
.cnt{text-align:center;font-size:11px;margin:8px 0}
.cnt b{font-family:"Courier New",monospace;background:#000;color:#39ff6a;padding:1px 4px;letter-spacing:3px;border:1px solid #555;text-shadow:0 0 4px #39ff6a}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 4px}
.menu a{position:relative;overflow:hidden;display:block;text-align:center;color:#fff;text-decoration:none;font-weight:bold;
background:linear-gradient(var(--hi2),var(--hi));border-radius:999px;padding:6px 2px;box-shadow:0 3px 0 color-mix(in srgb,var(--hi) 60%,#000);text-shadow:0 1px 1px rgba(0,0,0,.25)}
.menu a::before{content:"";position:absolute;left:8%;right:8%;top:2px;height:45%;border-radius:999px;background:rgba(255,255,255,.5)}
.menu a:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--hi) 60%,#000)}
.menu a.w{grid-column:1/-1}
.ttl{margin:14px 0 8px;text-align:center;color:#fff;font-weight:bold;font-size:14px;border-radius:12px;padding:3px;
background:linear-gradient(90deg,var(--hi),var(--hi2),var(--hi));background-size:200% 100%;animation:fr 3s linear infinite;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.ttl::before,.ttl::after{content:"✧･ﾟ";color:#fff6a8}
.ttl::after{content:"ﾟ･✧"}
.dv{text-align:center;color:var(--hi2);letter-spacing:-1px;overflow:hidden;white-space:nowrap;margin:10px 0;font-size:12px}
dl{margin:0}
dt{color:var(--hi);font-weight:bold;margin-top:7px}
dt::before{content:"♡";margin-right:3px;color:var(--hi2)}
dd{margin:0 0 0 1.1em;padding:1px 0 4px;border-bottom:1px dotted var(--line);word-break:break-all;min-height:1.5em}
.ent{border-left:3px solid var(--hi2);padding:2px 0 2px 8px;margin:10px 0}
.ent .d{color:var(--hi);font-size:11px;font-weight:bold}
.bl{display:block;text-decoration:none;color:var(--ink);border-bottom:1px dotted var(--line);padding:6px 2px}
.bl .d{color:var(--hi);font-size:11px;font-weight:bold}
.bl .t{font-weight:bold}
.art h2{font-size:16px;margin:4px 0;color:var(--hi);text-align:center}
.art .d{text-align:center;font-size:11px;opacity:.8}
.art .bd{margin:12px 0;word-break:break-all}
.pn{display:flex;justify-content:space-between;font-size:12px;margin-top:12px}
.pn a,.back a,.lk a,.more a{color:var(--hi)}
.hist{margin:0;padding:0;list-style:none}
.hist li{border-bottom:1px dotted var(--line);padding:3px 0}
.new{color:#ff1f1f;font-weight:bold;font-size:10px;animation:bl .8s steps(1) infinite;margin-left:4px}
@keyframes bl{50%{opacity:0}}
.empty{text-align:center;font-size:11px;opacity:.6}
.back{text-align:center;margin-top:18px;font-size:12px}
.more{text-align:right;font-size:11px;margin:4px 0 0}
.foot{text-align:center;font-size:11px;margin-top:16px;opacity:.85}
@media (prefers-reduced-motion:reduce){.marq span,.tw,.new,h1,.screen,.ttl{animation:none}.marq span{padding-left:6px}}
a:focus-visible{outline:2px solid var(--hi);outline-offset:2px}

.mbar{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:380px;margin:0 auto;padding:6px 10px;font-size:11px;background:#000;color:#ffd6ec;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
.mbar a{color:#ff9ad5;text-decoration:none;font-weight:bold}
.mbar .lg{background:linear-gradient(90deg,#ff4fa3,#ffe94a,#4fc3ff,#b77bff);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:13px}
@media (max-width:420px){.mbar{max-width:none}}
.mood{text-align:center;margin:6px 0;font-size:12px}
.mood b{font-size:15px;color:var(--hi)}
.song{margin:10px 0}.song iframe{display:block;width:100%;border:0;border-radius:12px}
.ein,.eta{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--frame);border:2px dashed var(--hi2);border-radius:6px;padding:5px 6px}
.eta{min-height:70px;resize:vertical}
.ein.big{text-align:center;font-weight:bold}
.elb{display:block;font-size:11px;color:var(--hi);font-weight:bold;margin:8px 0 2px}
.ebtn{font:inherit;font-size:12px;font-weight:bold;color:#fff;background:linear-gradient(var(--hi2),var(--hi));border:0;border-radius:999px;padding:5px 12px;min-height:32px;cursor:pointer}
.ebtn.sub{background:none;color:var(--hi);border:1px solid var(--hi)}
.qrow{border-bottom:1px dotted var(--line);padding:6px 0;display:flex;flex-direction:column;gap:4px}
.moods{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.moods button{font:inherit;font-size:12px;background:var(--frame);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 5px;min-height:28px;cursor:pointer}
.edbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(0,0,0,.88);color:#fff;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;font-size:12px;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
.edbar select{font-size:16px;padding:4px;border-radius:6px}
.edbar .st{width:100%;text-align:center;color:#ffe066;min-height:1em}
.fab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50}
.note{text-align:center;padding:30px 10px}

.dk-big{font-size:1.45em}.dk-sm{font-size:.78em}.dk-bl{animation:bl 1s steps(1) infinite}.dk-ct{display:block;text-align:center}
.dk-rb{font-weight:bold;background:linear-gradient(90deg,#ff5fa2,#ffb347,#e6c800,#3ccf7a,#4fb6ff,#b98bff,#ff5fa2);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 3s linear infinite}
.dk-mq{display:block;overflow:hidden;white-space:nowrap}.dk-mq>span{display:inline-block;padding-left:100%;animation:mq 10s linear infinite}
body.ed{padding-bottom:210px}
.edbar{flex-direction:column;align-items:stretch;gap:6px}
.tools{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.edbar>*{min-width:0;max-width:100%}.sh{overflow-wrap:anywhere}
.tools button{flex:0 0 auto;min-width:32px;padding:0 4px;min-height:36px;font:inherit;font-size:13px;color:#fff;background:#2a0a20;border:1px solid #ff6fb5;border-radius:8px;cursor:pointer}
.tools .rbt{background:linear-gradient(90deg,#ff5fa2,#ffb347,#3ccf7a,#4fb6ff,#b98bff)}
.acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.ebtn.lt{color:#fff;border-color:#fff}
.sh{max-height:46vh;overflow-y:auto;background:#1a0614;border:1px solid #ff6fb5;border-radius:10px;padding:8px 10px;text-align:left}
.shh{margin:6px 0 4px;font-weight:bold;color:#ffe066;font-size:12px}
.sh select{font-size:16px;padding:4px;border-radius:6px;max-width:100%}
.sw{display:flex;flex-wrap:wrap;gap:8px}.sw button{width:34px;height:34px;border-radius:50%;border:2px solid #fff;cursor:pointer}
.pal{display:flex;flex-wrap:wrap;gap:4px}.pal button{font:inherit;font-size:13px;color:#fff;background:#2a0a20;border:1px solid #6b2a55;border-radius:6px;padding:4px 6px;min-height:34px;cursor:pointer}
.pal.emo button{font-size:18px;min-width:38px}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.cg label{display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px}
.cg input{width:44px;height:34px;border:0;background:none;padding:0;cursor:pointer}
.note2{font-size:11px;color:#c9a2ff;margin:6px 0}
.mrow{display:flex;gap:4px;align-items:center;margin:4px 0}.mrow .ein{flex:1;min-width:0;color:#ffe3f1;background:#2a0a20}
.mon{font-size:11px;white-space:nowrap;display:flex;align-items:center;gap:2px}
.mini{min-width:32px;min-height:32px;font:inherit;color:#fff;background:#2a0a20;border:1px solid #ff6fb5;border-radius:6px;cursor:pointer}

.kiri{text-align:center;margin:8px 0;padding:8px;border:2px dashed var(--hi);border-radius:10px}
.vact{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.ftag{font-size:12px;font-weight:bold;color:var(--hi);display:inline-flex;align-items:center}
.box{border:1px dashed var(--hi2);border-radius:8px;padding:8px;margin:6px 0 10px}
.dia{border-bottom:1px dotted var(--line);padding:6px 0}.dia summary{cursor:pointer;font-weight:bold;min-height:30px}.dia .d{color:var(--hi);font-size:11px}.dia .bd{margin:8px 0;word-break:break-all}
.ptag{font-size:10px;background:var(--hi2);color:#fff;border-radius:999px;padding:0 6px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:start}.pgrid figure{margin:0;text-align:center;min-width:0}.pgrid a.pz{display:block}.pgrid img{display:block;width:100%;height:auto;object-fit:contain;border:2px solid var(--hi2);border-radius:6px}.pgrid figcaption{font-size:11px;word-break:break-all}
.mini2{font:inherit;font-size:11px;color:var(--hi);background:none;border:1px solid var(--hi);border-radius:999px;padding:0 8px;min-height:24px;cursor:pointer}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--card);color:var(--ink);border:3px solid var(--hi2);border-radius:14px;padding:12px;max-width:340px;width:100%}

.sz{vertical-align:middle;max-width:100%}
.tags{text-align:center;font-size:12px;margin:6px 0}.tags a{color:var(--hi);margin:0 3px}
.tg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px}.tg label{display:flex;align-items:center;gap:3px;min-height:28px}
.hist .d{color:var(--hi);font-size:11px}.hist a{color:var(--ink)}
.mbar .ic{font-size:14px;text-decoration:none}

.uhtml{display:block;width:100%;height:200px;border:0;background:#fff;border-radius:6px}
.eta.code{font-family:"Courier New",monospace;font-size:13px;white-space:pre;overflow-x:auto}

/* ===== 平成リアル寄せ ===== */
.menu a{border-radius:0;background:var(--hi);border:2px outset var(--hi2);box-shadow:none;text-shadow:none;padding:5px 2px;font-size:12px}
.menu a::before{display:none}
.menu a:active{transform:none;box-shadow:none;border-style:inset}
.ttl{border-radius:0;font-size:13px}
.ebtn{border-radius:0;background:var(--hi);border:2px outset var(--hi2);font-size:12px}
.ebtn.sub{background:var(--card);border:2px outset var(--line)}
.ebtn:active{border-style:inset}
.mini2{border-radius:0}
.ein,.eta{border-radius:0;border:2px inset var(--hi2)}
.tools button,.mini,.pal button,.moods button{border-radius:0}
.sh{border-radius:0}.mbox{border-radius:0}.kiri{border-radius:0}.box{border-radius:0}
.pgrid img{border-radius:0}.pic{border-radius:0}
.song iframe{border-radius:0}
.mbar .lg{font-family:"Jiskan16","MS PGothic","ＭＳ Ｐゴシック","Hiragino Kaku Gothic ProN",sans-serif}

.edbar .ebtn.sub,.edbar .ebtn.lt{background:#2a0a20;color:#fff;border:2px outset #ff9ad5}
.edbar .ebtn{color:#fff}
.tgc{border-bottom:1px dotted #6b2a55;padding:4px 0}.tgc summary{cursor:pointer;font-size:12px;min-height:28px;display:flex;align-items:center}

.mch{display:flex;flex-direction:column;gap:8px;margin:10px 0}.mch .ebtn{min-height:44px;line-height:1.3}.mch small{font-weight:normal;font-size:10px}
.toast{position:fixed;left:50%;top:20%;transform:translateX(-50%);z-index:70;background:#ff3d9a;color:#fff;font-weight:bold;padding:10px 18px;border:2px outset #ffb3d9;animation:tst 2.2s ease forwards}
@keyframes tst{0%{opacity:0;transform:translate(-50%,10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.tplg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.tplc{display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;font-size:12px;font-weight:bold;color:var(--ink);background:var(--card);border:2px outset var(--line);padding:8px;cursor:pointer;min-height:44px}
.tplc .sw{display:block;width:100%;height:44px;border:1px solid var(--line)}
.sw[data-skin=pink]{background:radial-gradient(#fff 2px,transparent 2.5px) 0 0/12px 12px,#ffb3d9}
.sw[data-skin=gal]{background:linear-gradient(135deg,#000 50%,#ff3d9a 50%);box-shadow:inset 0 0 0 3px #d4a017}
.sw[data-skin=yume]{background:linear-gradient(135deg,#ffd6f0,#d6e8ff,#e8d6ff)}
.sw[data-skin=mizu]{background:radial-gradient(#fff 2px,transparent 2.5px) 0 0/12px 12px,#9be3ff}
.sw[data-skin=lemon]{background:radial-gradient(#fff 2px,transparent 2.5px) 0 0/12px 12px,#ffe866}
.bxr{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dotted var(--line);font-size:12px}.bxa{display:flex;gap:4px;flex:0 0 auto}
.modal .mbox{max-height:86vh;overflow-y:auto}
/* ===== テンプレ（レイアウト） ===== */
:root[data-skin="leo"]{--bg:#c9944a;--pat:#2b1500;--card:#0d0805;--ink:#ffe9c9;--hi:#d4a017;--hi2:#ffe58a;--sub:#ff2e97;--line:#5a3a10;--title2:#000;--frame:#1a0f05;--glit:#ffd700,#fff3b0,#ff4fa8}
:root[data-skin="jirai"]{--bg:#0d0008;--pat:#2a0017;--card:#140009;--ink:#ffd9ea;--hi:#ff6fae;--hi2:#ffb3d1;--sub:#3a0020;--line:#5a1b38;--title2:#000;--frame:#1a000d;--glit:#ffb3d1,#ffffff,#ff6fae}
:root[data-skin="pop"]{--bg:#fff27a;--pat:#ff7ab8;--card:#fff;--ink:#1a1a1a;--hi:#ff3d6e;--hi2:#3db8ff;--sub:#7cf07c;--line:#1a1a1a;--title2:#000;--frame:#fff;--glit:#ff3d6e,#3db8ff,#ffd400,#7cf07c}
:root[data-skin="street"]{--bg:#2b2b2e;--pat:#3a3a3e;--card:#18181a;--ink:#f2f2f2;--hi:#c6ff1a;--hi2:#ff3dc5;--sub:#ffd400;--line:#444;--title2:#000;--frame:#202022;--glit:#c6ff1a,#ff3dc5,#ffffff}
:root[data-skin="kr"]{--bg:#f4ede4;--pat:#e9dfd2;--card:#fffdf9;--ink:#5a4a3f;--hi:#b89580;--hi2:#d8c2b0;--sub:#efe6dc;--line:#e2d6c8;--title2:#fff;--frame:#fffdf9;--glit:#ffffff,#e9cfc0,#d8c2b0}
:root[data-skin="voc"]{--bg:#070a1a;--pat:#0f1640;--card:#0a0e24;--ink:#d9f7ff;--hi:#28e0ff;--hi2:#ff3dd4;--sub:#12204f;--line:#1d2c66;--title2:#000;--frame:#0a0e24;--glit:#28e0ff,#ff3dd4,#ffffff}
:root[data-skin="y2k"]{--bg:#c9d4e6;--pat:#e6ecf5;--card:#f4f7fc;--ink:#26304a;--hi:#3d6bff;--hi2:#ff6fd0;--sub:#dfe6f2;--line:#9aa8c2;--title2:#fff;--frame:#e6ecf5;--glit:#ffffff,#9ad8ff,#ffb3ec}
/* 共通：ガラケー以外はケータイ枠なし */
:root:not([data-tpl="garake"]) .phone{max-width:440px;margin:16px auto 90px;border-radius:0;padding:0;box-shadow:none;background:none}
:root:not([data-tpl="garake"]) .screen{animation:none;border-radius:0}
:root:not([data-tpl="garake"]) .sb{display:none}

/* テンプレ選択のミニ見本 */

.sw[data-t=street]{background:repeating-linear-gradient(-45deg,#ffd400 0 8px,#111 8px 16px) 0 0/100% 10px no-repeat,#2b2b2e;box-shadow:inset 4px 0 0 #c6ff1a}

/* ===== テンプレ構成パーツ ===== */
:root:not([data-tpl="garake"]) .phone{max-width:340px}
:root:not([data-tpl="garake"]) .screen{border:6px double var(--hi);box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--line)}
.in{text-align:center}
.hd{margin:4px 0 2px}.hsub{margin:0;font-size:11px;color:var(--hi)}
.msg{margin:10px 0;word-break:break-all;line-height:1.75;text-align:center}
.topimg{margin:8px 0}
.cnt.hit{font-family:"Courier New",monospace;font-weight:bold;color:var(--hi);font-size:13px}
.cnt.hit::before{content:"✿ ";color:var(--hi2)}
.ln{margin:8px 0;overflow:hidden;white-space:nowrap;font-size:13px;line-height:1.2;color:var(--hi2);letter-spacing:0}
.ln-rainbow{height:12px;background:linear-gradient(#ff5fa2 0 3px,transparent 3px 4.5px,#ffd400 4.5px 7.5px,transparent 7.5px 9px,#4fc3ff 9px 12px);margin:10px 16px}
.ln-stars{color:var(--ink);font-size:17px;letter-spacing:-1px}
.ln-cstars{font-size:20px;letter-spacing:-2px}
.ln-meme{color:#ffd400;font-size:10px}
.ln-dots{height:2px;background:radial-gradient(var(--hi2) 1px,transparent 1.5px) 0 0/6px 2px}
.ln-eq{color:var(--hi);letter-spacing:1px}
/* ﾒﾆｭｰ：色ﾎﾞﾀﾝ＋説明 */
.mn-bars{display:flex;flex-direction:column;gap:3px;margin:10px auto;width:fit-content;max-width:100%}
.mn-bars a{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:12px}
.mn-bars .bb{display:inline-block;width:96px;padding:1px 6px;text-align:left;color:#fff;font-weight:bold;font-family:"Courier New",monospace;text-shadow:1px 1px 0 rgba(0,0,0,.35)}
.mn-bars .bd{white-space:nowrap}
/* ﾒﾆｭｰ：表で左右2列＋写真 */
.mn-table{display:grid;grid-template-columns:44% 1fr;gap:6px;margin:8px 0;text-align:left}
.mn-table nav{display:flex;flex-direction:column;gap:3px}
.mn-table nav a{display:flex;align-items:flex-end;min-height:44px;padding:2px 6px;color:#1a1a1a;text-decoration:none;font-weight:bold;font-size:12px}
.mn-table nav a i{font-style:normal;color:#4fc3ff;margin-right:2px}
.mn-table .mt-img{display:flex;align-items:center;justify-content:center;border:1px solid #bbb;background:#fff;padding:8px;box-shadow:3px 3px 6px rgba(0,0,0,.2)}
.mn-table .mt-img img{width:100%;height:auto}
.mn-table .mt-img span{color:#bbb;font-size:12px}
/* ﾒﾆｭｰ：2列アイコン */
.mn-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:10px 8px}
.mn-pair a{display:flex;align-items:center;gap:4px;justify-content:center;text-decoration:none;color:var(--ink);font-size:12px;min-height:26px}
.mn-pair a i{display:inline-block;width:14px;height:14px;border:2px solid var(--hi2);background:var(--card);flex:0 0 auto}
.mn-pair a:nth-child(3n+2) i{border-color:#ffd400}.mn-pair a:nth-child(3n) i{border-color:#4fc3ff}
/* ﾒﾆｭｰ：タブ（横並び） */
.mn-tabs{display:flex;flex-wrap:wrap;justify-content:center;margin:10px 0}
.mn-tabs a{padding:5px 8px;text-decoration:none;color:var(--ink);font-size:12px;border-right:1px solid var(--line)}
.mn-tabs a:last-child{border-right:0}
/* ﾒﾆｭｰ：縦リスト＋説明 */
.mn-list{display:flex;flex-direction:column;margin:10px 0;text-align:left;counter-reset:tr}
.mn-list a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);counter-increment:tr}
.mn-list .ml{font-weight:bold}.mn-list .md{font-size:10px;color:var(--hi2)}
/* ﾒﾆｭｰ：アイコン */
.mn-icons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 4px;margin:10px 0}

function sanitizeHtml(code,depth){depth=depth||0;var doc;try{doc=new DOMParser().parseFromString('<!DOCTYPE html><html><head></head><body>'+String(code||'')+'</body></html>','text/html')}catch(e){return ''}
  var all=doc.body.querySelectorAll('*'),i,el;
  for(i=all.length-1;i>=0;i--){el=all[i];var tn=el.tagName.toUpperCase();
    if(tn==='IFRAME'){var sd=el.getAttribute('srcdoc');
      if(sd==null||depth>=3){el.remove();continue}
      Array.prototype.slice.call(el.attributes).forEach(function(a){var n=a.name.toLowerCase();if(n!=='class'&&n!=='title')el.removeAttribute(a.name)});
      el.setAttribute('sandbox','allow-scripts allow-top-navigation-by-user-activation');
      var bm=sd.match(/<body[^>]*>([\s\S]*)<\/body>/i);
      el.setAttribute('srcdoc',htmlDoc(bm?bm[1]:sd,depth+1));
      continue}
    if(HBAD[tn]){el.remove();continue}
    Array.prototype.slice.call(el.attributes).forEach(function(a){var n=a.name.toLowerCase(),v=a.value.replace(/[\s\u0000-\u001f]/g,'').toLowerCase();
      if(n.indexOf('on')===0||n==='srcdoc'||n==='formaction'||n==='action'||n==='ping'||n==='target')el.removeAttribute(a.name);
      else if(/(^|:)(href|src|srcset|poster|background|xlink:href|data|lowsrc|dynsrc)$/.test(n)&&/^(javascript|vbscript|data:(?!image\/(png|gif|jpe?g|webp)))/.test(v))el.removeAttribute(a.name)});
    if(tn==='A'){var hr=el.getAttribute('href');if(hr==null)continue;hr=hr.trim();var m;
      if(/^#[a-z0-9_-]*$/i.test(hr)){el.setAttribute('href',hpAbs(hr.slice(1)));el.setAttribute('target','_top')}
      else if((m=hr.match(/^(?:(?:https?:)?\/\/[^\/]*\/)?(?:hp\.html)?\?id=([a-z0-9_]{3,16})(#[a-z0-9_-]*)?$/i))&&(hr.indexOf('//')<0||hr.indexOf(location.host)>=0)){el.setAttribute('href',location.origin+location.pathname+'?id='+m[1]+(m[2]||''));el.setAttribute('target','_top')}
      else{el.removeAttribute('href');el.setAttribute('title','外のｻｲﾄへのﾘﾝｸゎ使えないょ')}}}
  return doc.body.innerHTML}

function isKiri(n){if(!n)return false;var L=String(D.kiri||'').split(/[,、\s]+/).map(Number).filter(Boolean);if(L.length)return L.indexOf(n)>=0;
  return n>=100&&(n%1000===0||/^(\d)\1+$/.test(String(n))||n===1234||n===12345)}
function shrink(file,mx){return new Promise(function(res,rej){var img=new Image(),u=URL.createObjectURL(file);
  img.onload=function(){var m=mx||600,w=img.naturalWidth,h=img.naturalHeight,r=Math.min(1,m/Math.max(w,h)),c=document.createElement('canvas');
    c.width=Math.round(w*r);c.height=Math.round(h*r);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(function(b){b?res(b):rej(new Error('画像を読み込めなかったょ'))},'image/jpeg',0.85)};
  img.onerror=function(){URL.revokeObjectURL(u);rej(new Error('この画像ゎ使えないみたい'))};img.src=u})}

function txtOf(h){return String(h||'').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<!--[\s\S]*?-->/g,' ').replace(/<[^>]+>/g,' ')}
function sampleCheck(){var hit=[];Object.keys(D.pages).forEach(function(k){var p=D.pages[k];if(!p||p.fmt==='html')return;var b=String(p.b||'');
    if(b.indexOf('○月○日')>=0||b.indexOf('（↓の「')>=0||/^\s*A[.．]\s*$/m.test(b))hit.push(plain(label(k)))});return hit}
function piCheck(){var pg=Object.keys(D.pages).map(function(k){var p=D.pages[k];return [p.b,txtOf(p.h)]}),hh=Object.keys(D.html||{}).map(function(k){return txtOf(D.html[k].h)});
  var all=JSON.stringify([D.title,D.sub,D.marquee,D.msg,D.intro,D.qa,D.real,pg,hh,D.menu.map(function(m){return m.l})]),hit=[];
  if(/0\d{1,4}[-ー－]?\d{1,4}[-ー－]?\d{3,4}/.test(all))hit.push('電話番号');
  if(/[\w.+-]+@[\w-]+\.[\w.]+/.test(all))hit.push('ﾒｰﾙｱﾄﾞﾚｽ');
  if(/(小学校|中学校|高校|高等学校|大学)/.test(all))hit.push('学校名');
  if(/(LINE|ﾗｲﾝ|ライン)\s*(ID|ＩＤ)?\s*[:：]/i.test(all))hit.push('LINE ID');
  return hit}
async function save(b,quiet){

  if(b)b.disabled=true;st('保存中…');
  try{await DB.saveHp(me.id,D,VIS);dirty=false;isNew=false;dropDraft();st('保存したょ✧');if(!quiet){ED=false;sheet='';PREV=false;draw();toast('保存したょ✧')}}catch(err){st(err.message)}if(b)b.disabled=false}

function note(t){document.documentElement.dataset.skin='gal';root.innerHTML=frame('<div class="note">'+t+'</div>')}
document.getElementById('rlt').onclick=async function(e){e.preventDefault();try{var id=await DB.randomHp();if(id)location.href='hp.html?id='+id;else UI.tell('まだﾎﾑﾍﾟがないみたい')}catch(err){UI.tell(err.message)}};

/* glitter */
var VIV=['#ff2d95','#ffd400','#2fc3ff','#b45cff','#ff7a00','#ffffff','#ff5fa2'];
var cv=document.getElementById('kira'),cx=cv.getContext('2d'),W=0,H=0,dpr=1,stars=[],parts=[],rings=[],cols=['#fff'];
var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function readGlit(){var v=getComputedStyle(document.documentElement).getPropertyValue('--glit');if(v)cols=v.split(',').map(function(x){return x.trim()}).filter(Boolean)}
function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  stars=[];var n=Math.round(Math.min(46,W*H/9000));for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:2+Math.random()*4,p:Math.random()*6.28,s:.6+Math.random()*1.6,c:Math.floor(Math.random()*9)})}
function star(x,y,r,a,c){cx.globalAlpha=a;cx.fillStyle=c;cx.beginPath();cx.moveTo(x,y-r);cx.quadraticCurveTo(x,y,x+r,y);cx.quadraticCurveTo(x,y,x,y+r);cx.quadraticCurveTo(x,y,x-r,y);cx.quadraticCurveTo(x,y,x,y-r);cx.fill()}
function frameDraw(t){
  cx.clearRect(0,0,W,H);
  stars.forEach(function(s){var a=Math.max(0,Math.sin(s.p+t/1000*s.s));if(a>.05)star(s.x,s.y,s.r*(.4+a*.6),a*.85,cols[s.c%cols.length])});
  for(var j=rings.length-1;j>=0;j--){var g=rings[j];g.r+=g.v;g.v*=.94;g.l-=.03;if(g.l<=0){rings.splice(j,1);continue}cx.globalAlpha=g.l;cx.strokeStyle=g.c;cx.lineWidth=2.5*g.l+.5;cx.beginPath();cx.arc(g.x,g.y,g.r,0,6.283);cx.stroke()}
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy=p.vy*.97+p.g;p.l-=p.d;if(p.l<=0){parts.splice(i,1);continue}
    var tw=p.tw?(.55+.45*Math.sin(t/60+p.ph)):1;star(p.x,p.y,(p.r*p.l+1.5)*tw,Math.min(1,p.l*1.4),p.c);if(p.r>6&&p.l>.5){cx.globalAlpha=p.l*.5;cx.fillStyle='#fff';cx.beginPath();cx.arc(p.x,p.y,1.6,0,6.283);cx.fill()}}
  cx.globalAlpha=1;
  if(!document.hidden)requestAnimationFrame(frameDraw);
}
if(!still){
  size();readGlit();addEventListener('resize',size);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)requestAnimationFrame(frameDraw)});
  addEventListener('pointerdown',function(e){var n=26+Math.floor(Math.random()*12),x=e.clientX,y=e.clientY;
    for(var i=0;i<n;i++){var a=Math.random()*6.283,v=1+Math.random()*(i<6?8:5);parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2,g:.06+Math.random()*.08,r:i<6?8+Math.random()*7:2+Math.random()*6,l:1,d:.012+Math.random()*.014,c:VIV[Math.floor(Math.random()*VIV.length)],tw:Math.random()<.6,ph:Math.random()*6}) }
    rings.push({x:x,y:y,r:4,v:7,l:1,c:'#ff2d95'});rings.push({x:x,y:y,r:2,v:4.5,l:.8,c:'#fff'});
    if(parts.length>400)parts.splice(0,parts.length-400)});
  requestAnimationFrame(frameDraw);
}
if(!still){}
})();
