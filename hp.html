<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ﾎﾑﾍﾟ｜めろﾋﾟｮﾝ☆</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ffd6ea;--pat:#ffb8d9;--card:#fff;--ink:#6b1f45;--hi:#ff3d9a;--hi2:#ff8cc6;--sub:#ffc1df;--line:#ffb3d6;--title2:#fff;--frame:#fff0f7;--glit:#ffffff,#ff7ac1,#ffe066}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-skin="pink"]{--bg:#2a0618;--pat:#4a0c2c;--card:#1c0410;--ink:#ffd3e9;--hi:#ff4fa8;--hi2:#c2397f;--sub:#6b1f45;--line:#6b1f45;--title2:#1c0410;--frame:#33091f}}
:root[data-theme="dark"][data-skin="pink"]{--bg:#2a0618;--pat:#4a0c2c;--card:#1c0410;--ink:#ffd3e9;--hi:#ff4fa8;--hi2:#c2397f;--sub:#6b1f45;--line:#6b1f45;--title2:#1c0410;--frame:#33091f}
:root[data-skin="gal"]{--bg:#000;--pat:#24001a;--card:#0b0006;--ink:#ffe3f1;--hi:#ff2e97;--hi2:#ff86c4;--sub:#d4a017;--line:#4a2238;--title2:#000;--frame:#1a0010;--glit:#ffd700,#ff4fa8,#ffffff}
:root[data-skin="mizu"]{--bg:#d4f1ff;--pat:#a8e2fb;--card:#fff;--ink:#164a66;--hi:#1ea7e6;--hi2:#7fd3f5;--sub:#c4ecfc;--line:#9fd9f3;--title2:#fff;--frame:#effaff;--glit:#ffffff,#7fd3f5,#d0b3ff}
:root[data-skin="lemon"]{--bg:#fffbd1;--pat:#fff08a;--card:#fff;--ink:#5c4a00;--hi:#ff9500;--hi2:#ffc766;--sub:#d6f5a8;--line:#f2df70;--title2:#fff;--frame:#fffde8;--glit:#ffffff,#ffd000,#9be36b}
:root[data-skin="yume"]{--bg:#f3e8ff;--pat:#ffd9f2;--card:#fff;--ink:#4a2a6b;--hi:#b45cff;--hi2:#e3a3ff;--sub:#bfeaff;--line:#dcc4f5;--title2:#fff;--frame:#fbf5ff;--glit:#ff8fd0,#8fd8ff,#fff27a,#b0ff9e}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;color:var(--ink);background-color:var(--bg);
background-image:radial-gradient(circle at 25% 25%,var(--pat) 3px,transparent 3.5px),radial-gradient(circle at 75% 75%,var(--pat) 3px,transparent 3.5px);background-size:22px 22px;
font-family:"MS PGothic","ＭＳ Ｐゴシック","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:13px;line-height:1.6}
#kira{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.phone{max-width:380px;margin:14px auto 80px;background:var(--frame);border-radius:30px;padding:10px 10px 20px;box-shadow:0 0 0 3px var(--hi2),0 7px 0 var(--hi)}
.screen{border:3px solid transparent;border-radius:8px;overflow:hidden;
background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(90deg,var(--hi),#ffe066,var(--hi2),#9be3ff,var(--hi)) border-box;
background-size:100% 100%,200% 100%;animation:fr 4s linear infinite}
@keyframes fr{to{background-position:0 0,200% 0}}
@media (max-width:420px){.phone{max-width:none;margin:0 0 80px;border-radius:0;padding:0;box-shadow:none;background:none}.screen{border-radius:0;border-width:0 0 3px}}
.sb{display:flex;justify-content:space-between;background:linear-gradient(var(--hi2),var(--hi));color:#fff;font-size:11px;padding:2px 6px;font-family:"Courier New",monospace}
.in{padding:8px 10px 16px}
h1{margin:8px 0 4px;text-align:center;font-size:23px;line-height:1.3;letter-spacing:.04em;
background:linear-gradient(90deg,#ff5fa2,#ffb347,#ffe94d,#74f0a0,#6ec8ff,#b98bff,#ff5fa2);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(1px 0 0 var(--title2)) drop-shadow(-1px 0 0 var(--title2)) drop-shadow(0 1px 0 var(--title2)) drop-shadow(0 -1px 0 var(--title2)) drop-shadow(2px 2px 0 var(--hi));animation:sh 3s linear infinite}
@keyframes sh{to{background-position:200% center}}
.tw{color:#ffd700;display:inline-block;animation:tw 1.4s ease-in-out infinite}
.tw.b{animation-delay:.7s;color:var(--hi2)}
@keyframes tw{50%{transform:scale(.5) rotate(45deg);opacity:.3}}
.marq{overflow:hidden;white-space:nowrap;background:linear-gradient(90deg,var(--hi),var(--hi2),var(--hi));color:#fff;font-size:12px;margin:6px -10px;text-shadow:0 0 3px rgba(0,0,0,.25)}
.marq span{display:inline-block;padding:2px 0 2px 100%;animation:mq 16s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.pic{display:block;margin:10px auto 4px;max-width:180px;width:70%;border:3px solid var(--hi2);outline:2px dotted #ffd700;outline-offset:3px;border-radius:6px}
.hito{text-align:center;margin:8px 0}
.cnt{text-align:center;font-size:11px;margin:8px 0}
.cnt b{font-family:"Courier New",monospace;background:#000;color:#39ff6a;padding:1px 4px;letter-spacing:3px;border:1px solid #555;text-shadow:0 0 4px #39ff6a}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 4px}
.menu a{position:relative;overflow:hidden;display:block;text-align:center;color:#fff;text-decoration:none;font-weight:bold;
background:linear-gradient(var(--hi2),var(--hi));border-radius:999px;padding:6px 2px;box-shadow:0 3px 0 color-mix(in srgb,var(--hi) 60%,#000);text-shadow:0 1px 1px rgba(0,0,0,.25)}
.menu a::before{content:"";position:absolute;left:8%;right:8%;top:2px;height:45%;border-radius:999px;background:rgba(255,255,255,.5)}
.menu a:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--hi) 60%,#000)}
.menu a.w{grid-column:1/-1}
.ttl{margin:14px 0 8px;text-align:center;color:#fff;font-weight:bold;font-size:14px;border-radius:12px;padding:3px;
background:linear-gradient(90deg,var(--hi),var(--hi2),var(--hi));background-size:200% 100%;animation:fr 3s linear infinite;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.ttl::before,.ttl::after{content:"✧･ﾟ";color:#fff6a8}
.ttl::after{content:"ﾟ･✧"}
.dv{text-align:center;color:var(--hi2);letter-spacing:-1px;overflow:hidden;white-space:nowrap;margin:10px 0;font-size:12px}
dl{margin:0}
dt{color:var(--hi);font-weight:bold;margin-top:7px}
dt::before{content:"♡";margin-right:3px;color:var(--hi2)}
dd{margin:0 0 0 1.1em;padding:1px 0 4px;border-bottom:1px dotted var(--line);word-break:break-all;min-height:1.5em}
.ent{border-left:3px solid var(--hi2);padding:2px 0 2px 8px;margin:10px 0}
.ent .d{color:var(--hi);font-size:11px;font-weight:bold}
.bl{display:block;text-decoration:none;color:var(--ink);border-bottom:1px dotted var(--line);padding:6px 2px}
.bl .d{color:var(--hi);font-size:11px;font-weight:bold}
.bl .t{font-weight:bold}
.art h2{font-size:16px;margin:4px 0;color:var(--hi);text-align:center}
.art .d{text-align:center;font-size:11px;opacity:.8}
.art .bd{margin:12px 0;word-break:break-all}
.pn{display:flex;justify-content:space-between;font-size:12px;margin-top:12px}
.pn a,.back a,.lk a,.more a{color:var(--hi)}
.hist{margin:0;padding:0;list-style:none}
.hist li{border-bottom:1px dotted var(--line);padding:3px 0}
.new{color:#ff1f1f;font-weight:bold;font-size:10px;animation:bl .8s steps(1) infinite;margin-left:4px}
@keyframes bl{50%{opacity:0}}
.empty{text-align:center;font-size:11px;opacity:.6}
.back{text-align:center;margin-top:18px;font-size:12px}
.more{text-align:right;font-size:11px;margin:4px 0 0}
.foot{text-align:center;font-size:11px;margin-top:16px;opacity:.85}
@media (prefers-reduced-motion:reduce){.marq span,.tw,.new,h1,.screen,.ttl{animation:none}.marq span{padding-left:6px}}
a:focus-visible{outline:2px solid var(--hi);outline-offset:2px}

.mbar{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:380px;margin:0 auto;padding:6px 10px;font-size:11px;background:#000;color:#ffd6ec;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
.mbar a{color:#ff9ad5;text-decoration:none;font-weight:bold}
.mbar .lg{background:linear-gradient(90deg,#ff4fa3,#ffe94a,#4fc3ff,#b77bff);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:13px}
@media (max-width:420px){.mbar{max-width:none}}
.mood{text-align:center;margin:6px 0;font-size:12px}
.mood b{font-size:15px;color:var(--hi)}
.song{margin:10px 0}.song iframe{display:block;width:100%;border:0;border-radius:12px}
.ein,.eta{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--frame);border:2px dashed var(--hi2);border-radius:6px;padding:5px 6px}
.eta{min-height:70px;resize:vertical}
.ein.big{text-align:center;font-weight:bold}
.elb{display:block;font-size:11px;color:var(--hi);font-weight:bold;margin:8px 0 2px}
.ebtn{font:inherit;font-size:12px;font-weight:bold;color:#fff;background:linear-gradient(var(--hi2),var(--hi));border:0;border-radius:999px;padding:5px 12px;min-height:32px;cursor:pointer}
.ebtn.sub{background:none;color:var(--hi);border:1px solid var(--hi)}
.qrow{border-bottom:1px dotted var(--line);padding:6px 0;display:flex;flex-direction:column;gap:4px}
.moods{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.moods button{font:inherit;font-size:12px;background:var(--frame);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 5px;min-height:28px;cursor:pointer}
.edbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(0,0,0,.88);color:#fff;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;font-size:12px;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
.edbar select{font-size:16px;padding:4px;border-radius:6px}
.edbar .st{width:100%;text-align:center;color:#ffe066;min-height:1em}
.fab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50}
.note{text-align:center;padding:30px 10px}
</style>
</head>
<body>
<div class="mbar"><a class="lg" href="index.html">めろﾋﾟｮﾝ☆</a><span id="mid"></span><a href="info.html#contact">通報</a></div>
<div id="root"><p class="note">読み込み中…</p></div>
<div id="ui"></div>
<canvas id="kira" aria-hidden="true"></canvas>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="db.js?v=2"></script>
<script>
(function(){
var root=document.getElementById('root'),ui=document.getElementById('ui');
var Q=new URLSearchParams(location.search),HID=(Q.get('id')||'').toLowerCase(),WANT=Q.get('edit')==='1';
var me=null,R=null,D=null,VIS='members',CNT=0,owner=false,ED=false,dirty=false,isNew=false;
var MOODS=['(*´∀`*)','(ﾉ´∀｀*)','(〃▽〃)','☆(ゝω・)v','(｀・ω・´)','(´；ω；｀)','(｡>﹏<｡)','(*´﹃｀*)','(-_-)zzz','ヽ(`Д´)ﾉ','┐(´д｀)┌','(=゜ω゜)ﾉ'];
var THEMES=[['pink','ﾋﾟﾝｸ水玉'],['gal','黒×ﾋﾟﾝｸ×ｺﾞｰﾙﾄﾞ'],['yume','ゆめかわ'],['mizu','水色'],['lemon','ﾚﾓﾝ']];
var DV='☆.｡.:*・°☆.｡.:*・°☆.｡.:*・°☆.｡.:*・°☆';
function esc(x){return DB.esc(x)}
function nl(x){return esc(x).replace(/\n/g,'<br>')}
function clock(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function def(nick){return {title:'☆★'+nick+'のﾎﾑﾍﾟ★☆',theme:'pink',marquee:'ようこそ(*´∀`*)ﾉﾞ ゆっくりしてってね☆',mood:'(*´∀`*)',showCounter:true,intro:'',song:'',
  qa:[['名前',''],['ﾆｯｸﾈｰﾑ',''],['誕生日',''],['血液型',''],['趣味',''],['好きな食べ物',''],['ﾏｲﾌﾞｰﾑ',''],['最後に一言','']],real:[]}}
function fix(d,nick){var b=def(nick);d=d&&typeof d==='object'?d:{};Object.keys(b).forEach(function(k){if(d[k]===undefined)d[k]=b[k]});
  if(!Array.isArray(d.qa))d.qa=[];if(!Array.isArray(d.real))d.real=[];return d}
function sp(u){var m=String(u||'').match(/open\.spotify\.com\/(?:intl-[a-z-]+\/)?(track|album|playlist|artist|episode)\/([A-Za-z0-9]{10,40})/);return m?'https://open.spotify.com/embed/'+m[1]+'/'+m[2]:''}
function tm(s){var d=new Date(s);return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function ttl(t){return '<p class="ttl">'+t+'</p>'}
function back(){return '<p class="back"><a href="#">◀ TOPへもどる</a></p>'}
function frame(inner){return '<div class="phone"><div class="screen"><div class="sb" aria-hidden="true"><span>📶 ﾊﾞﾘ3</span><span id="clk">'+clock()+'</span><span>🔋▮▮▮</span></div><div class="in">'+inner+'</div></div></div>'}
function inp(k,v,cls,ph){return '<input class="ein '+(cls||'')+'" data-k="'+k+'" value="'+esc(v)+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'}
function top(){
  var h='',s=sp(D.song);
  h+=ED?'<span class="elb">ﾎﾑﾍﾟ名</span>'+inp('title',D.title,'big'):'<h1><span class="tw">✦</span>'+esc(D.title)+'<span class="tw b">✦</span></h1>';
  if(ED)h+='<span class="elb">流れる文字</span>'+inp('marquee',D.marquee);else if(D.marquee)h+='<div class="marq"><span>'+esc(D.marquee)+'</span></div>';
  if(ED){h+='<span class="elb">今日の気分</span>'+inp('mood',D.mood)+'<div class="moods">'+MOODS.map(function(m){return '<button type="button" data-act="mood" data-v="'+esc(m)+'">'+esc(m)+'</button>'}).join('')+'</div>'}
  else if(D.mood)h+='<p class="mood">今日の気分 <b>'+esc(D.mood)+'</b></p>';
  if(ED)h+='<label class="elb"><input type="checkbox" data-k="showCounter"'+(D.showCounter?' checked':'')+'> カウンターを表示する</label>';
  else if(D.showCounter&&!isNew)h+='<p class="cnt">あなたは <b>'+esc(('000000'+CNT).slice(-6))+'</b> 人目のお客様です♪</p>';
  if(ED)h+='<span class="elb">今のお気に入り曲（SpotifyのURL）</span>'+inp('song',D.song,'','https://open.spotify.com/track/…')+(D.song&&!s?'<p class="empty">SpotifyのURLの形じゃないかも</p>':'');
  if(s)h+='<div class="song"><iframe src="'+esc(s)+'" height="152" loading="lazy" allow="clipboard-write; encrypted-media; fullscreen; picture-in-picture" title="お気に入り曲"></iframe></div>';
  h+='<div class="dv" aria-hidden="true">'+DV+'</div>';
  h+='<nav class="menu"><a href="#prof">♡ﾌﾟﾛﾌ♡</a><a href="#intro">♡自己紹介♡</a><a class="w" href="#real">♡ﾘｱﾙ♡</a></nav>';
  if(D.real.length){var r=D.real[0];h+=ttl('最新ﾘｱﾙ')+'<div class="ent"><div class="d">'+esc(tm(r.at))+'</div>'+nl(r.t)+'</div>'}
  h+='<p class="foot">'+esc(R.nickname)+' のﾎﾑﾍﾟ ／ Powered by めろﾋﾟｮﾝ☆</p>';
  return h}
function prof(){
  var h=ttl('ﾌﾟﾛﾌ');
  if(ED){D.qa.forEach(function(p,i){h+='<div class="qrow"><input class="ein" data-q="'+i+',0" value="'+esc(p[0])+'" placeholder="質問"><textarea class="eta" data-q="'+i+',1" placeholder="答え" style="min-height:44px">'+esc(p[1])+'</textarea><div style="text-align:right"><button type="button" class="ebtn sub" data-act="delqa" data-i="'+i+'">この項目を消す</button></div></div>'});
    return h+'<p style="text-align:center"><button type="button" class="ebtn" data-act="addqa">＋ 項目を追加</button></p><p class="empty">※住んでる場所・学校名・本名ゎ書かないでね</p>'+back()}
  var n=0;h+='<dl>';D.qa.forEach(function(p){if(!p[0]&&!p[1])return;n++;h+='<dt>'+esc(p[0])+'</dt><dd>'+nl(p[1])+'</dd>'});h+='</dl>';
  if(!n)h+='<p class="empty">まだﾌﾟﾛﾌがありません</p>';return h+back()}
function intro(){
  var h=ttl('自己紹介');
  if(ED)return h+'<textarea class="eta" data-k="intro" style="min-height:200px" placeholder="自由に書いてね♪">'+esc(D.intro)+'</textarea>'+back();
  return h+(D.intro?'<p style="word-break:break-all">'+nl(D.intro)+'</p>':'<p class="empty">まだ自己紹介がありません</p>')+back()}
function real(){
  var h=ttl('ﾘｱﾙ');
  if(ED)h+='<textarea class="eta" id="newreal" maxlength="200" placeholder="いまなにしてる？" style="min-height:60px"></textarea><p style="text-align:right;margin:4px 0"><button type="button" class="ebtn" data-act="addreal">ﾘｱﾙる♪</button></p>';
  if(!D.real.length)h+='<p class="empty">まだﾘｱﾙはありません</p>';
  D.real.forEach(function(e,i){h+='<div class="ent"><div class="d">'+esc(tm(e.at))+(i===0?'<span class="new">NEW!</span>':'')+(ED?' <button type="button" class="ebtn sub" data-act="delreal" data-i="'+i+'" style="min-height:24px;padding:0 8px">消す</button>':'')+'</div>'+nl(e.t)+'</div>'});
  return h+back()}
function draw(){
  var r=location.hash.replace(/^#/,'');
  document.documentElement.dataset.skin=D.theme||'pink';document.title=(D.title||'ﾎﾑﾍﾟ')+'｜めろﾋﾟｮﾝ☆';
  root.innerHTML=frame(({prof:prof,intro:intro,real:real}[r]||top)());
  readGlit();drawUi()}
function drawUi(){
  if(!owner){ui.innerHTML='';return}
  if(!ED){ui.innerHTML='<div class="fab"><button type="button" class="ebtn" data-act="edit" style="min-height:44px;padding:0 18px">✎ 編集する</button></div>';return}
  ui.innerHTML='<div class="edbar"><select id="th" aria-label="着せ替え">'+THEMES.map(function(t){return '<option value="'+t[0]+'"'+(D.theme===t[0]?' selected':'')+'>'+t[1]+'</option>'}).join('')+'</select>'+
   '<select id="vis" aria-label="公開範囲"><option value="public"'+(VIS==='public'?' selected':'')+'>誰でも見れる</option><option value="members"'+(VIS==='members'?' selected':'')+'>会員だけ</option><option value="private"'+(VIS==='private'?' selected':'')+'>自分だけ</option></select>'+
   '<button type="button" class="ebtn" data-act="save">保存する</button><button type="button" class="ebtn sub" data-act="view" style="color:#fff;border-color:#fff">見た目確認</button><div class="st" id="st" role="status">'+(dirty?'まだ保存してないょ':'')+'</div></div>';
  document.getElementById('th').onchange=function(){D.theme=this.value;dirty=true;draw()};
  document.getElementById('vis').onchange=function(){VIS=this.value;dirty=true;st('まだ保存してないょ')}}
function st(t){var e=document.getElementById('st');if(e)e.textContent=t}
root.addEventListener('input',function(e){var t=e.target,k=t.getAttribute('data-k'),q=t.getAttribute('data-q');
  if(k){D[k]=t.type==='checkbox'?t.checked:t.value;dirty=true;st('まだ保存してないょ')}
  else if(q){var p=q.split(',');D.qa[+p[0]][+p[1]]=t.value;dirty=true;st('まだ保存してないょ')}});
root.addEventListener('change',function(e){if(e.target.getAttribute('data-k')==='song'){draw()}});
document.addEventListener('click',async function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.getAttribute('data-act'),i=+b.getAttribute('data-i');
  if(a==='edit'){ED=true;draw()}
  else if(a==='view'){ED=false;draw()}
  else if(a==='mood'){D.mood=b.getAttribute('data-v');dirty=true;draw()}
  else if(a==='addqa'){D.qa.push(['','']);dirty=true;draw()}
  else if(a==='delqa'){D.qa.splice(i,1);dirty=true;draw()}
  else if(a==='addreal'){var t=document.getElementById('newreal').value.trim();if(!t)return;D.real.unshift({t:t,at:new Date().toISOString()});D.real=D.real.slice(0,50);dirty=true;draw();st('まだ保存してないょ')}
  else if(a==='delreal'){if(confirm('このﾘｱﾙを消す？')){D.real.splice(i,1);dirty=true;draw()}}
  else if(a==='save'){await save(b)}});
function piCheck(){var all=JSON.stringify(D),hit=[];
  if(/0\d{1,4}[-ー－]?\d{1,4}[-ー－]?\d{3,4}/.test(all))hit.push('電話番号');
  if(/[\w.+-]+@[\w-]+\.[\w.]+/.test(all))hit.push('ﾒｰﾙｱﾄﾞﾚｽ');
  if(/(小学校|中学校|高校|高等学校|大学)/.test(all))hit.push('学校名');
  if(/(LINE|ﾗｲﾝ|ライン)\s*(ID|ＩＤ)?\s*[:：]/i.test(all))hit.push('LINE ID');
  return hit}
async function save(b){var hit=piCheck();
  if(hit.length&&!confirm(hit.join('・')+'っぽいものが入ってるょ。\n誰でも見れる場所に個人情報を書くのゎ危ないよ。\nこのまま保存する？'))return;
  b.disabled=true;st('保存中…');
  try{await DB.saveHp(me.id,D,VIS);dirty=false;isNew=false;st('保存したょ✧')}catch(err){st(err.message)}b.disabled=false}
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue=''}});
window.addEventListener('hashchange',function(){draw();scrollTo(0,0)});
setInterval(function(){var c=document.getElementById('clk');if(c)c.textContent=clock()},30000);
function note(t){document.documentElement.dataset.skin='gal';root.innerHTML=frame('<div class="note">'+t+'</div>')}
(async function(){
  if(!/^[a-z0-9_]{3,16}$/.test(HID)){note('ﾎﾑﾍﾟが見つからないょ<br><br><a href="index.html">めろﾋﾟｮﾝ☆TOPへ</a>');return}
  try{me=await DB.me();R=await DB.getHp(HID)}catch(e){note(esc(e.message));return}
  if(!R){note('このIDのﾎﾑﾍﾟゎ見つからないょ<br><br><a href="index.html">めろﾋﾟｮﾝ☆TOPへ</a>');return}
  document.getElementById('mid').textContent='ID: '+R.hp_id;
  owner=!!(me&&me.id===R.id);
  if(R.hp){D=fix(R.hp.data,R.nickname);VIS=R.hp.visibility;CNT=R.hp.counter}
  else if(owner){var info=await DB.myInfo(me.id);
    if(!info||(info.needs_guardian&&!info.guardian_approved)){note('ﾏｲﾍﾟｰｼﾞで設定を済ませてね<br><br><a href="mypage.html">ﾏｲﾍﾟｰｼﾞへ</a>');return}
    D=def(R.nickname);isNew=true;VIS=DB.age(info.birth_ym.slice(0,7))<18?'members':'public';dirty=true}
  else{note(me?'このﾎﾑﾍﾟゎ見れないか、まだ作られてないょ':'このﾎﾑﾍﾟを見るにゎﾛｸﾞｲﾝが必要かも<br><br><a href="login.html">ﾛｸﾞｲﾝ</a>');return}
  ED=owner&&(WANT||isNew);
  draw();
  if(!owner&&R.hp){DB.visit(HID).then(function(n){if(n){CNT=n;if(!ED&&!location.hash)draw()}}).catch(function(){})}
})();
/* glitter */
var cv=document.getElementById('kira'),cx=cv.getContext('2d'),W=0,H=0,dpr=1,stars=[],parts=[],cols=['#fff'];
var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function readGlit(){var v=getComputedStyle(document.documentElement).getPropertyValue('--glit');if(v)cols=v.split(',').map(function(x){return x.trim()}).filter(Boolean)}
function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  stars=[];var n=Math.round(Math.min(46,W*H/9000));for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:2+Math.random()*4,p:Math.random()*6.28,s:.6+Math.random()*1.6,c:Math.floor(Math.random()*9)})}
function star(x,y,r,a,c){cx.globalAlpha=a;cx.fillStyle=c;cx.beginPath();cx.moveTo(x,y-r);cx.quadraticCurveTo(x,y,x+r,y);cx.quadraticCurveTo(x,y,x,y+r);cx.quadraticCurveTo(x,y,x-r,y);cx.quadraticCurveTo(x,y,x,y-r);cx.fill()}
function frameDraw(t){
  cx.clearRect(0,0,W,H);
  stars.forEach(function(s){var a=Math.max(0,Math.sin(s.p+t/1000*s.s));if(a>.05)star(s.x,s.y,s.r*(.4+a*.6),a*.85,cols[s.c%cols.length])});
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.l-=.022;if(p.l<=0){parts.splice(i,1);continue}star(p.x,p.y,p.r*p.l+1,p.l,p.c)}
  cx.globalAlpha=1;
  if(!document.hidden)requestAnimationFrame(frameDraw);
}
if(!still){
  size();readGlit();addEventListener('resize',size);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)requestAnimationFrame(frameDraw)});
  addEventListener('pointerdown',function(e){for(var i=0;i<10;i++){var a=Math.random()*6.28,v=1.5+Math.random()*3;parts.push({x:e.clientX,y:e.clientY,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,r:3+Math.random()*4,l:1,c:cols[i%cols.length]})}});
  requestAnimationFrame(frameDraw);
}
if(!still){}
})();
</script>
