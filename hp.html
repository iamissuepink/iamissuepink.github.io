function back(){return '<p class="back"><a href="#">◀ TOPへもどる</a></p>'}
function frame(inner){return '<div class="phone"><div class="screen"><div class="sb" aria-hidden="true"><span>📶 ﾊﾞﾘ3</span><span id="clk">'+clock()+'</span><span>🔋▮▮▮</span></div><div class="in">'+inner+'</div></div></div>'}
function inp(k,v,cls,ph){return '<input class="ein '+(cls||'')+'" data-k="'+k+'" value="'+esc(v)+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'}
function ta(attr,v,ph,h){return '<textarea class="eta deco" '+attr+' placeholder="'+esc(ph||'')+'"'+(h?' style="min-height:'+h+'px"':'')+'>'+esc(v)+'</textarea>'}
function iconOk(){return D.icon&&D.icon.indexOf(DB.imgBase)===0}
function top(){
  var h='',s=sp(D.song);
  h+=ED?'<span class="elb">ﾎﾑﾍﾟ名</span>'+inp('title',D.title,'big'):'<h1><span class="tw">✦</span>'+esc(D.title)+'<span class="tw b">✦</span></h1>';
  if(ED)h+='<span class="elb">流れる文字</span>'+inp('marquee',D.marquee,'deco');else if(D.marquee)h+='<div class="marq"><span>'+deco(D.marquee)+'</span></div>';
  if(iconOk())h+='<img class="pic" src="'+esc(D.icon)+'" alt="ﾌﾟﾛﾌ画像">';
  if(ED)h+='<p style="text-align:center;margin:6px 0"><button type="button" class="ebtn sub" data-act="sheet" data-v="design">ﾌﾟﾛﾌ画像・色を変える</button></p>';
  if(ED){h+='<span class="elb">今日の気分</span>'+inp('mood',D.mood)+'<div class="moods">'+MOODS.map(function(m){return '<button type="button" data-act="mood" data-v="'+esc(m)+'">'+esc(m)+'</button>'}).join('')+'</div>'}
  else if(D.mood)h+='<p class="mood">今日の気分 <b>'+esc(D.mood)+'</b></p>';
  if(ED)h+='<label class="elb"><input type="checkbox" data-k="showCounter"'+(D.showCounter?' checked':'')+'> カウンターを表示する</label>';
  else if(D.showCounter&&!isNew)h+='<p class="cnt">あなたは <b>'+esc(('000000'+CNT).slice(-6))+'</b> 人目のお客様です♪</p>';
  if(!ED&&KIRI)h+='<div class="kiri"><b class="dk-rb dk-big">ｷﾘ番ｹﾞｯﾄ!!</b><br>'+KIRI+' 番目のお客様です♪'+(me&&!owner?'<br><button type="button" class="ebtn" data-act="kirirep">BBSで報告する</button>':'')+'</div>';
  if(ED)h+='<span class="elb">ｷﾘ番（カンマ区切り。空なら 777・1000 などゾロ目とキリのいい数）</span>'+inp('kiri',D.kiri,'','例：100,500,1000');
  if(!ED){h+='<div class="vact">';
    h+='<button type="button" class="ebtn" data-act="clap">👏 拍手'+((D.showClaps||owner)&&CLAPS!==null?' ('+CLAPS+')':'')+'</button>';
    if(me&&!owner)h+=FR==='friend'?'<span class="ftag">めろ友だょ♡</span>':FR==='sent'?'<span class="ftag">めろ友申請中…</span>':FR==='in'?'<button type="button" class="ebtn" data-act="facc">めろ友申請を承認</button>':'<button type="button" class="ebtn sub" data-act="freq">めろ友申請</button>';
    if(owner)h+='<a class="ebtn sub" href="#foot" style="text-decoration:none;display:inline-flex;align-items:center">足あと</a>';
    h+='</div>'}
  if(ED)h+='<span class="elb">拍手のお礼ﾒｯｾｰｼﾞ</span>'+ta('data-k="thanks"',D.thanks,'',60)+'<label class="elb"><input type="checkbox" data-k="showClaps"'+(D.showClaps?' checked':'')+'> 拍手の数をみんなに見せる</label>';
  if(ED)h+='<span class="elb">今のお気に入り曲（SpotifyのURL）</span>'+inp('song',D.song,'','https://open.spotify.com/track/…')+(D.song&&!s?'<p class="empty">SpotifyのURLの形じゃないかも</p>':'');
  if(s)h+='<div class="song"><iframe src="'+esc(s)+'" height="152" loading="lazy" allow="clipboard-write; encrypted-media; fullscreen; picture-in-picture" title="お気に入り曲"></iframe></div>';
  h+='<div class="dv" aria-hidden="true">'+DV+'</div>';
  var items=D.menu.filter(function(m){return m.on||ED});
  h+='<nav class="menu">'+items.map(function(m,i){return '<a href="#'+esc(m.k)+'"'+(i===items.length-1&&items.length%2?' class="w"':'')+(m.on?'':' style="opacity:.45"')+'>'+esc(m.l||'ﾍﾟｰｼﾞ')+'</a>'}).join('')+'</nav>';
  if(ED)h+='<p style="text-align:center;margin:4px 0"><button type="button" class="ebtn sub" data-act="sheet" data-v="menu">ﾒﾆｭｰを編集・ﾍﾟｰｼﾞを追加</button></p>';
  if(D.real.length){var r=D.real[0];h+=ttl('最新ﾘｱﾙ')+'<div class="ent"><div class="d">'+esc(tm(r.at))+'</div>'+deco(r.t)+'</div>'}
  h+='<p class="foot">'+esc(R.nickname)+' のﾎﾑﾍﾟ ／ Powered by めろﾋﾟｮﾝ☆</p>';
  return h}
function label(k){var m=D.menu.filter(function(x){return x.k===k})[0];return esc(m?m.l:BUILTIN[k]||'ﾍﾟｰｼﾞ')}
function prof(){
  var h=ttl(label('prof'));
  if(ED){D.qa.forEach(function(p,i){h+='<div class="qrow"><input class="ein" data-q="'+i+',0" value="'+esc(p[0])+'" placeholder="質問">'+ta('data-q="'+i+',1"',p[1],'答え',44)+'<div style="text-align:right"><button type="button" class="ebtn sub" data-act="delqa" data-i="'+i+'">この項目を消す</button></div></div>'});
    return h+'<p style="text-align:center"><button type="button" class="ebtn" data-act="addqa">＋ 項目を追加</button></p><p class="empty">※住んでる場所・学校名・本名ゎ書かないでね</p>'+back()}
  var n=0;h+='<dl>';D.qa.forEach(function(p){if(!p[0]&&!p[1])return;n++;h+='<dt>'+esc(p[0])+'</dt><dd>'+deco(p[1])+'</dd>'});h+='</dl>';
  if(!n)h+='<p class="empty">まだﾌﾟﾛﾌがありません</p>';return h+back()}
function intro(){
  var h=ttl(label('intro'));
  if(ED)return h+ta('data-k="intro"',D.intro,'自由に書いてね♪',200)+back();
  return h+(D.intro?'<p style="word-break:break-all">'+deco(D.intro)+'</p>':'<p class="empty">まだ自己紹介がありません</p>')+back()}
function real(){
  var h=ttl(label('real'));
  if(ED)h+=ta('id="newreal" maxlength="200"','','いまなにしてる？',60)+'<p style="text-align:right;margin:4px 0"><button type="button" class="ebtn" data-act="addreal">ﾘｱﾙる♪</button></p>';
  if(!D.real.length)h+='<p class="empty">まだﾘｱﾙはありません</p>';
  D.real.forEach(function(e,i){h+='<div class="ent"><div class="d">'+esc(tm(e.at))+(i===0?'<span class="new">NEW!</span>':'')+(ED?' <button type="button" class="ebtn sub" data-act="delreal" data-i="'+i+'" style="min-height:24px;padding:0 8px">消す</button>':'')+'</div>'+deco(e.t)+'</div>'});
  return h+back()}
function page(k){
  var p=D.pages[k];if(!p)return ttl('ﾍﾟｰｼﾞ')+'<p class="empty">このﾍﾟｰｼﾞゎ見つからないょ</p>'+back();
  if(ED)return ttl(label(k))+'<span class="elb">ﾍﾟｰｼﾞの中身</span>'+ta('data-pg="'+esc(k)+'"',p.b,'自由に書いてね♪',260)+back();
  return ttl(label(k))+(p.b?'<p style="word-break:break-all">'+deco(p.b)+'</p>':'<p class="empty">まだ何も書いてないょ</p>')+back()}
/* 交流ページ */
var LOAD={diary:ldDiary,photo:ldPhoto,bbs:ldBbs,ask:ldAsk,link:ldLink,foot:ldFoot};

function ap(h){var e=document.getElementById('ap');if(e)e.innerHTML=h}
function fail(e){ap('<p class="empty">'+esc(e.message)+'</p>')}

    (ED?'<p style="text-align:right;margin:4px 0"><button type="button" class="ebtn sub" data-act="dpub" data-i="'+d.id+'" data-v="'+(d.is_public?'0':'1')+'">'+(d.is_public?'非公開にする':'公開する')+'</button> <button type="button" class="ebtn sub" data-act="ddel" data-i="'+d.id+'">消す</button></p>':'')+'</details>'});
  ap(h)}catch(e){fail(e)}}
async function ldPhoto(){try{var L=await DB.photos(R.id),h='';
  if(ED)h+='<div class="box"><label class="ebtn" style="display:inline-flex;align-items:center">写真を選ぶ<input type="file" id="pf" accept="image/*" hidden></label> <input class="ein" id="pc" maxlength="100" placeholder="ひとこと（なくてもOK）" style="margin-top:6px"><p class="note2" style="color:var(--hi)">※自動で小さくして、撮った場所の情報を消すょ</p></div>';
  if(!L.length)h+='<p class="empty">まだ写真ゎありません</p>';
  h+='<div class="pgrid">'+L.map(function(p){return '<figure><img src="'+esc(DB.imgBase+p.path)+'" alt="'+esc(p.caption||'写真')+'" loading="lazy">'+(p.caption?'<figcaption>'+esc(p.caption)+'</figcaption>':'')+(ED?'<button type="button" class="ebtn sub" data-act="pdel" data-i="'+p.id+'" data-v="'+esc(p.path)+'">消す</button>':'')+'</figure>'}).join('')+'</div>';
  ap(h);var f=document.getElementById('pf');if(f)f.onchange=function(){if(f.files[0])upPhoto(f.files[0])}}catch(e){fail(e)}}

async function ldAsk(){try{var L=await DB.questions(R.id),h='';

function applyColors(){var st=document.documentElement.style;CV.forEach(function(c){if(hex(D.colors[c[0]]))st.setProperty('--'+c[0],D.colors[c[0]]);else st.removeProperty('--'+c[0])})}
function draw(){
  var r=location.hash.replace(/^#/,'');
  document.documentElement.dataset.skin=D.theme||'pink';applyColors();
  document.title=(D.title||'ﾎﾑﾍﾟ')+'｜めろﾋﾟｮﾝ☆';document.body.classList.toggle('ed',ED);
  var f={prof:prof,intro:intro,real:real}[r];
  if(LOAD[r]){root.innerHTML=frame(apage(r));LOAD[r]()}
  else root.innerHTML=frame(f?f():(D.pages[r]?page(r):top()));
  readGlit();drawUi()}
function cur(v){return getComputedStyle(document.documentElement).getPropertyValue('--'+v).trim()}
function sheetHtml(){
  if(sheet==='color')return '<div class="sh"><p class="shh">文字の色（選んだ文字を囲むょ）</p><div class="sw">'+COLS.map(function(c){return '<button type="button" data-act="wrapc" data-v="'+c[1]+'" style="background:'+c[1]+'" aria-label="'+c[0]+'"></button>'}).join('')+'</div></div>';
  if(sheet==='kao')return '<div class="sh"><p class="shh">顔文字</p><div class="pal">'+KAO.map(function(k){return '<button type="button" data-act="ins" data-v="'+esc(k)+'">'+esc(k)+'</button>'}).join('')+'</div></div>';
  if(sheet==='emo')return '<div class="sh"><p class="shh">デコ絵文字</p><div class="pal emo">'+EMO.map(function(k){return '<button type="button" data-act="ins" data-v="'+esc(k)+'">'+esc(k)+'</button>'}).join('')+'</div></div>';
  if(sheet==='design'){
    var h='<div class="sh"><p class="shh">着せ替え</p><select id="th">'+THEMES.map(function(t){return '<option value="'+t[0]+'"'+(D.theme===t[0]?' selected':'')+'>'+t[1]+'</option>'}).join('')+'</select>';
    h+='<p class="shh">色をこまかく変える</p><div class="cg">'+CV.map(function(c){var v=hex(D.colors[c[0]])?D.colors[c[0]]:cur(c[0]);if(!hex(v))v='#ffffff';return '<label>'+c[1]+'<input type="color" data-cv="'+c[0]+'" value="'+esc(v)+'"></label>'}).join('')+'</div>';
    h+='<p><button type="button" class="ebtn sub lt" data-act="resetc">色を着せ替えの元に戻す</button></p>';
    h+='<p class="shh">ﾌﾟﾛﾌ画像</p><label class="ebtn" style="display:inline-flex;align-items:center">画像を選ぶ<input type="file" id="iconf" accept="image/*" hidden></label> '+(D.icon?'<button type="button" class="ebtn sub lt" data-act="delicon">画像を外す</button>':'');
    h+='<p class="note2">※画像ゎ自動で小さくして、撮った場所の情報を消してから保存するょ。顔や制服、家の周りが写った写真ゎ気をつけてね</p>';
    h+='<p class="shh">公開範囲</p><select id="vis"><option value="public"'+(VIS==='public'?' selected':'')+'>誰でも見れる</option><option value="members"'+(VIS==='members'?' selected':'')+'>会員だけ</option><option value="friends"'+(VIS==='friends'?' selected':'')+'>めろ友だけ</option><option value="private"'+(VIS==='private'?' selected':'')+'>自分だけ</option></select></div>';
    return h}
  if(sheet==='menu'){
    var h2='<div class="sh"><p class="shh">ﾒﾆｭｰ（名前・表示・並び順）</p>';
    D.menu.forEach(function(m,i){h2+='<div class="mrow"><input class="ein" data-ml="'+i+'" value="'+esc(m.l)+'" maxlength="20"><label class="mon"><input type="checkbox" data-mo="'+i+'"'+(m.on?' checked':'')+'>表示</label><button type="button" class="mini" data-act="mup" data-i="'+i+'" aria-label="上へ">▲</button><button type="button" class="mini" data-act="mdown" data-i="'+i+'" aria-label="下へ">▼</button>'+(BUILTIN[m.k]?'':'<button type="button" class="mini" data-act="mdel" data-i="'+i+'" aria-label="消す">×</button>')+'</div>'});
    return h2+'<p><button type="button" class="ebtn" data-act="padd">＋ ﾍﾟｰｼﾞを追加</button></p><p class="note2">追加したﾍﾟｰｼﾞゎﾒﾆｭｰから開いて中身を書いてね</p></div>'}
  return ''}
function drawUi(){
  if(!owner){ui.innerHTML='';return}
  if(!ED){ui.innerHTML='<div class="fab"><button type="button" class="ebtn" data-act="edit" style="min-height:44px;padding:0 18px">✎ 編集する</button></div>';return}
  ui.innerHTML='<div class="edbar">'+sheetHtml()+
   '<div class="tools" aria-label="文字の装飾"><button type="button" data-act="sheet" data-v="color" style="color:#ff6fb5">色</button><button type="button" data-act="wrap" data-v="b"><b>B</b></button><button type="button" data-act="wrap" data-v="big">大</button><button type="button" data-act="wrap" data-v="small" style="font-size:11px">小</button><button type="button" data-act="wrap" data-v="blink">点滅</button><button type="button" data-act="wrap" data-v="rb" class="rbt">虹</button><button type="button" data-act="wrap" data-v="mq">流</button><button type="button" data-act="wrap" data-v="center">中</button><button type="button" data-act="sheet" data-v="kao">顔</button><button type="button" data-act="sheet" data-v="emo">♡</button></div>'+
   '<div class="acts"><button type="button" class="ebtn sub lt" data-act="sheet" data-v="design">ﾃﾞｻﾞｲﾝ</button><button type="button" class="ebtn sub lt" data-act="sheet" data-v="menu">ﾒﾆｭｰ</button><button type="button" class="ebtn" data-act="save">保存する</button><button type="button" class="ebtn sub lt" data-act="view">見た目確認</button></div>'+
   '<div class="st" id="st" role="status">'+(dirty?'まだ保存してないょ':'')+'</div></div>';
  var th=document.getElementById('th');if(th)th.onchange=function(){D.theme=this.value;D.colors={};changed();draw()};
  var vs=document.getElementById('vis');if(vs)vs.onchange=function(){VIS=this.value;changed()};
  ui.querySelectorAll('[data-cv]').forEach(function(el){el.oninput=function(){D.colors[el.getAttribute('data-cv')]=el.value;applyColors();readGlit();changed()}});
  ui.querySelectorAll('[data-ml]').forEach(function(el){el.oninput=function(){D.menu[+el.getAttribute('data-ml')].l=el.value;changed();if(!location.hash)redrawPage()}});
  ui.querySelectorAll('[data-mo]').forEach(function(el){el.onchange=function(){D.menu[+el.getAttribute('data-mo')].on=el.checked;changed();redrawPage()}});
  var f=document.getElementById('iconf');if(f)f.onchange=function(){if(f.files[0])upIcon(f.files[0])}}
function redrawPage(){var r=location.hash.replace(/^#/,''),fn={prof:prof,intro:intro,real:real}[r];if(LOAD[r])return;root.innerHTML=frame(fn?fn():(D.pages[r]?page(r):top()))}
function changed(){dirty=true;st('まだ保存してないょ')}
function st(t){var e=document.getElementById('st');if(e)e.textContent=t}
/* 選んだ文字を囲む・挿入 */
function target(){if(lastF&&document.body.contains(lastF))return lastF;st('先に文字を書く欄をタップしてね');return null}
function edit(el,a,b){var s=el.selectionStart,e=el.selectionEnd,v=el.value;el.value=v.slice(0,s)+a+v.slice(s,e)+b+v.slice(e);el.focus();el.setSelectionRange(s+a.length,e+a.length);el.dispatchEvent(new Event('input',{bubbles:true}))}
document.addEventListener('focusin',function(e){var t=e.target;if(t.classList&&t.classList.contains('deco'))lastF=t});
ui.addEventListener('pointerdown',function(e){if(e.target.closest('.tools button,.sw button,.pal button'))e.preventDefault()});
root.addEventListener('input',function(e){var t=e.target,k=t.getAttribute('data-k'),q=t.getAttribute('data-q'),pg=t.getAttribute('data-pg');
  if(k){D[k]=t.type==='checkbox'?t.checked:t.value;changed()}
  else if(q){var p=q.split(',');D.qa[+p[0]][+p[1]]=t.value;changed()}
  else if(pg&&D.pages[pg]){D.pages[pg].b=t.value;changed()}});
root.addEventListener('change',function(e){if(e.target.getAttribute('data-k')==='song')draw()});
document.addEventListener('click',async function(e){var b=e.target.closest('[data-act]');if(!b)return;var a=b.getAttribute('data-act'),i=+b.getAttribute('data-i'),v=b.getAttribute('data-v'),el;
  if(a==='edit'){ED=true;draw()}
  else if(a==='view'){ED=false;sheet='';draw()}
  else if(a==='sheet'){sheet=sheet===v?'':v;drawUi()}
  else if(a==='wrap'){if(el=target())edit(el,'['+v+']','[/'+v+']')}
  else if(a==='wrapc'){if(el=target())edit(el,'[c='+v+']','[/c]')}
  else if(a==='ins'){if(el=target())edit(el,v,'')}
  else if(a==='mood'){D.mood=v;changed();draw()}
  else if(a==='addqa'){D.qa.push(['','']);changed();draw()}
  else if(a==='delqa'){D.qa.splice(i,1);changed();draw()}
  else if(a==='addreal'){var t=document.getElementById('newreal').value.trim();if(!t)return;D.real.unshift({t:t,at:new Date().toISOString()});D.real=D.real.slice(0,50);changed();draw()}
  else if(a==='delreal'){if(confirm('このﾘｱﾙを消す？')){D.real.splice(i,1);changed();draw()}}
  else if(a==='mup'&&i>0){D.menu.splice(i-1,0,D.menu.splice(i,1)[0]);changed();drawUi();redrawPage()}
  else if(a==='mdown'&&i<D.menu.length-1){D.menu.splice(i+1,0,D.menu.splice(i,1)[0]);changed();drawUi();redrawPage()}
  else if(a==='mdel'){if(confirm('このﾍﾟｰｼﾞを消す？（中身も消えるょ）')){var k=D.menu[i].k;delete D.pages[k];D.menu.splice(i,1);changed();if(location.hash==='#'+k)location.hash='';drawUi();redrawPage()}}
  else if(a==='padd'){if(D.menu.length>=12){st('ﾍﾟｰｼﾞゎ12個までだょ');return}var k2='p'+Date.now().toString(36);D.pages[k2]={b:''};D.menu.push({k:k2,l:'♡新しいﾍﾟｰｼﾞ♡',on:true});changed();drawUi();redrawPage()}
  else if(a==='resetc'){D.colors={};applyColors();readGlit();changed();drawUi()}
  else if(a==='delicon'){if(confirm('ﾌﾟﾛﾌ画像を外す？')){var old=D.iconPath;D.icon='';D.iconPath='';await save(null,true);if(old)DB.delImg(old).catch(function(){});draw()}}
  else if(a==='save'){await save(b)}
  else if(a==='clap'){if(!me){alert('拍手するにゎﾛｸﾞｲﾝしてね');return}try{CLAPS=await DB.clap(R.id);thanks()}catch(err){alert(err.message)}}
  else if(a==='closem'){var m=document.getElementById('modal');if(m)m.remove();draw()}
  else if(a==='freq'){if(!confirm(R.nickname+' さんにめろ友申請する？'))return;try{await DB.requestFriend(R.id);FR='sent';draw()}catch(err){alert(err.message)}}
  else if(a==='facc'){try{await DB.acceptFriend(FR_ID);FR='friend';draw()}catch(err){alert(err.message)}}
  else if(a==='kirirep'){try{await DB.addHpPost(R.id,'【ｷﾘ番報告】'+KIRI+' 番を踏みました♪');alert('BBSに報告したょ✧');location.hash='bbs'}catch(err){alert(err.message)}}
  else if(a==='dadd'){var t1=document.getElementById('dt').value.trim(),b1=document.getElementById('db').value;if(!b1.trim()){st('本文を書いてね');return}try{await DB.addDiary(t1,b1,document.getElementById('dp').checked);ldDiary()}catch(err){st(err.message)}}
  else if(a==='dpub'){try{await DB.setDiaryPub(i,v==='1');ldDiary()}catch(err){st(err.message)}}
  else if(a==='ddel'){if(confirm('この日記を消す？'))try{await DB.delDiary(i);ldDiary()}catch(err){st(err.message)}}
  else if(a==='pdel'){if(confirm('この写真を消す？'))try{await DB.delPhoto(i);DB.delImg(v).catch(function(){});ldPhoto()}catch(err){st(err.message)}}
  else if(a==='badd'){var t2=document.getElementById('bb').value.trim();if(!t2)return;try{await DB.addHpPost(R.id,t2);ldBbs()}catch(err){alert(err.message)}}
  else if(a==='bdel'){if(confirm('この書き込みを消す？'))try{await DB.delHpPost(i);ldBbs()}catch(err){alert(err.message)}}
  else if(a==='bblk'){if(confirm('この人をﾌﾞﾛｯｸする？（このﾎﾑﾍﾟのBBSと質問箱に書き込めなくなるょ）'))try{await DB.block(v);alert('ﾌﾞﾛｯｸしたょ')}catch(err){alert(err.message)}}
  else if(a==='qadd'){var t3=document.getElementById('qq').value.trim();if(!t3)return;try{await DB.ask(R.id,t3);alert('質問を送ったょ✧ 回答されたらここに表示されるょ');ldAsk()}catch(err){alert(err.message)}}
  else if(a==='qans'){var t4=(document.querySelector('[data-qa="'+i+'"]')||{}).value||'';if(!t4.trim())return;try{await DB.answer(i,t4);ldAsk()}catch(err){alert(err.message)}}
  else if(a==='qdel'){if(confirm('この質問を消す？'))try{await DB.delQ(i);ldAsk()}catch(err){alert(err.message)}}
  else if(a==='qblk'){if(confirm('この質問をした人をﾌﾞﾛｯｸする？（誰かゎわからないままだょ）'))try{await DB.blockAsker(i);await DB.delQ(i);ldAsk()}catch(err){alert(err.message)}}
});
var FR_ID=null;
function thanks(){var m=document.createElement('div');m.id='modal';m.className='modal';
  m.innerHTML='<div class="mbox"><p class="ttl">拍手ありがと♪</p><p style="text-align:center">'+deco(D.thanks)+'</p>'+((D.showClaps||owner)?'<p class="cnt">これまでの拍手 <b>'+CLAPS+'</b></p>':'')+'<p style="text-align:center"><button type="button" class="ebtn" data-act="clap2">もっと拍手👏</button> <button type="button" class="ebtn sub" data-act="closem">とじる</button></p></div>';
  var old=document.getElementById('modal');if(old)old.remove();document.body.appendChild(m)}
document.addEventListener('click',async function(e){if(e.target.closest('[data-act=clap2]')){try{CLAPS=await DB.clap(R.id);thanks()}catch(err){alert(err.message)}}});
function isKiri(n){if(!n)return false;var L=String(D.kiri||'').split(/[,、\s]+/).map(Number).filter(Boolean);if(L.length)return L.indexOf(n)>=0;
  return n>=100&&(n%1000===0||/^(\d)\1+$/.test(String(n))||n===1234||n===12345)}
function shrink(file,mx){return new Promise(function(res,rej){var img=new Image(),u=URL.createObjectURL(file);
  img.onload=function(){var m=mx||600,w=img.naturalWidth,h=img.naturalHeight,r=Math.min(1,m/Math.max(w,h)),c=document.createElement('canvas');
    c.width=Math.round(w*r);c.height=Math.round(h*r);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(function(b){b?res(b):rej(new Error('画像を読み込めなかったょ'))},'image/jpeg',0.85)};
  img.onerror=function(){URL.revokeObjectURL(u);rej(new Error('この画像ゎ使えないみたい'))};img.src=u})}
async function upIcon(file){st('画像を準備中…');
  try{var blob=await shrink(file);st('ｱｯﾌﾟﾛｰﾄﾞ中…');var r=await DB.uploadImg(me.id,blob),old=D.iconPath;D.icon=r.url;D.iconPath=r.path;
    await save(null,true);if(old)DB.delImg(old).catch(function(){});draw();st('画像を変えたょ✧')}
  catch(err){st(err.message)}}
function piCheck(){var all=JSON.stringify([D.title,D.marquee,D.intro,D.qa,D.real,D.pages,D.menu]),hit=[];
  if(/0\d{1,4}[-ー－]?\d{1,4}[-ー－]?\d{3,4}/.test(all))hit.push('電話番号');
  if(/[\w.+-]+@[\w-]+\.[\w.]+/.test(all))hit.push('ﾒｰﾙｱﾄﾞﾚｽ');
  if(/(小学校|中学校|高校|高等学校|大学)/.test(all))hit.push('学校名');
  if(/(LINE|ﾗｲﾝ|ライン)\s*(ID|ＩＤ)?\s*[:：]/i.test(all))hit.push('LINE ID');
  return hit}
async function save(b,quiet){
  if(!quiet){var hit=piCheck();if(hit.length&&!confirm(hit.join('・')+'っぽいものが入ってるょ。\n誰でも見れる場所に個人情報を書くのゎ危ないよ。\nこのまま保存する？'))return}
  if(b)b.disabled=true;st('保存中…');
  try{await DB.saveHp(me.id,D,VIS);dirty=false;isNew=false;st('保存したょ✧')}catch(err){st(err.message)}if(b)b.disabled=false}
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue=''}});
window.addEventListener('hashchange',function(){draw();scrollTo(0,0)});
setInterval(function(){var c=document.getElementById('clk');if(c)c.textContent=clock()},30000);
function note(t){document.documentElement.dataset.skin='gal';root.innerHTML=frame('<div class="note">'+t+'</div>')}
(async function(){
  if(!/^[a-z0-9_]{3,16}$/.test(HID)){note('ﾎﾑﾍﾟが見つからないょ<br><br><a href="index.html">めろﾋﾟｮﾝ☆TOPへ</a>');return}
  try{me=await DB.me();R=await DB.getHp(HID)}catch(e){note(esc(e.message));return}
  if(!R){note('このIDのﾎﾑﾍﾟゎ見つからないょ<br><br><a href="index.html">めろﾋﾟｮﾝ☆TOPへ</a>');return}
  document.getElementById('mid').textContent='ID: '+R.hp_id;
  owner=!!(me&&me.id===R.id);
  if(R.hp){D=fix(R.hp.data,R.nickname);VIS=R.hp.visibility;CNT=R.hp.counter}
  else if(owner){var info=await DB.myInfo(me.id);
    if(!info||(info.needs_guardian&&!info.guardian_approved)){note('ﾏｲﾍﾟｰｼﾞで設定を済ませてね<br><br><a href="mypage.html">ﾏｲﾍﾟｰｼﾞへ</a>');return}
    D=def(R.nickname);isNew=true;VIS=DB.age(info.birth_ym.slice(0,7))<18?'members':'public';dirty=true}
  else{note(me?'このﾎﾑﾍﾟゎ見れないか、まだ作られてないょ':'このﾎﾑﾍﾟを見るにゎﾛｸﾞｲﾝが必要かも<br><br><a href="login.html">ﾛｸﾞｲﾝ</a>');return}
  ED=owner&&(WANT||isNew);
  draw();
  if(R.hp){DB.clapCount(R.id).then(function(n){CLAPS=n;if(!location.hash&&!ED)draw()}).catch(function(){})}
  if(!owner&&R.hp){DB.visit(HID).then(function(n){if(n){CNT=n;if(isKiri(n))KIRI=n;if(!location.hash)draw()}}).catch(function(){})}
  if(me&&!owner&&R.hp){DB.footprint(R.id).catch(function(){});
    DB.friendWith(me.id,R.id).then(function(f){if(!f)FR='none';else if(f.status==='accepted')FR='friend';else if(f.from_id===me.id)FR='sent';else{FR='in';FR_ID=f.id}if(!location.hash)draw()}).catch(function(){})}
})();
/* glitter */
var cv=document.getElementById('kira'),cx=cv.getContext('2d'),W=0,H=0,dpr=1,stars=[],parts=[],cols=['#fff'];
var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function readGlit(){var v=getComputedStyle(document.documentElement).getPropertyValue('--glit');if(v)cols=v.split(',').map(function(x){return x.trim()}).filter(Boolean)}
function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  stars=[];var n=Math.round(Math.min(46,W*H/9000));for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:2+Math.random()*4,p:Math.random()*6.28,s:.6+Math.random()*1.6,c:Math.floor(Math.random()*9)})}
function star(x,y,r,a,c){cx.globalAlpha=a;cx.fillStyle=c;cx.beginPath();cx.moveTo(x,y-r);cx.quadraticCurveTo(x,y,x+r,y);cx.quadraticCurveTo(x,y,x,y+r);cx.quadraticCurveTo(x,y,x-r,y);cx.quadraticCurveTo(x,y,x,y-r);cx.fill()}
function frameDraw(t){
  cx.clearRect(0,0,W,H);
  stars.forEach(function(s){var a=Math.max(0,Math.sin(s.p+t/1000*s.s));if(a>.05)star(s.x,s.y,s.r*(.4+a*.6),a*.85,cols[s.c%cols.length])});
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.l-=.022;if(p.l<=0){parts.splice(i,1);continue}star(p.x,p.y,p.r*p.l+1,p.l,p.c)}
  cx.globalAlpha=1;
  if(!document.hidden)requestAnimationFrame(frameDraw);
}
if(!still){
  size();readGlit();addEventListener('resize',size);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)requestAnimationFrame(frameDraw)});
  addEventListener('pointerdown',function(e){for(var i=0;i<10;i++){var a=Math.random()*6.28,v=1.5+Math.random()*3;parts.push({x:e.clientX,y:e.clientY,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,r:3+Math.random()*4,l:1,c:cols[i%cols.length]})}});
  requestAnimationFrame(frameDraw);
}
if(!still){}
})();
</script>
