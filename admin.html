<script>
var $=function(i){return document.getElementById(i)},E=DB.esc,ST='open',TY={hp:'ﾎﾑﾍﾟ',bbs:'みんなの掲示板の書き込み',hp_bbs:'ﾎﾑﾍﾟBBSの書き込み',diary:'日記',photo:'写真',question:'質問箱',material:'素材'};
function tm(s){var d=new Date(s);return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
async function loadReps(){$('reps').innerHTML='<p class="msg">読み込み中…</p>';try{var L=await DB.reports(ST);
  $('reps').innerHTML=L.length?L.map(function(r){return '<div class="li"><span class="dt">'+tm(r.created_at)+'</span> <b style="color:#ffe066">'+E(r.reason)+'</b><br>'+E(TY[r.target_type]||r.target_type)+' #'+E(r.target_id)+(r.hp_id?' ／ <a href="hp.html?id='+E(r.hp_id)+'" target="_blank">'+E(r.hp_id)+'のﾎﾑﾍﾟ</a>':'')+(r.detail?'<br><small>'+E(r.detail)+'</small>':'')+
    '<br>'+(r.target_type!=='hp'?'<button type="button" class="del" data-del="'+r.id+'" data-t="'+E(r.target_type)+'" data-tid="'+E(r.target_id)+'">中身を削除</button>':'')+(r.hp_id?'<button type="button" class="del" data-sus="'+E(r.hp_id)+'">ﾎﾑﾍﾟを凍結</button>':'')+
    (ST==='open'?'<button type="button" class="del" data-done="'+r.id+'">対応済みにする</button>':'<button type="button" class="del" data-reopen="'+r.id+'">未対応に戻す</button>')+'</div>'}).join(''):'<p>通報ゎありません</p>'}
  catch(e){$('reps').innerHTML='<p class="msg ng">'+E(e.message)+'</p>'}}
async function loadHps(){try{var L=await DB.adminHps();
  $('hps').innerHTML=L.length?L.map(function(h){return '<div class="li"><a href="hp.html?id='+E(h.hp_id)+'" target="_blank">'+E(h.title||h.nickname)+'</a> <small>（'+E(h.hp_id)+' ／ '+E(h.visibility)+' ／ '+(h.age==null?'?':h.age)+'歳）</small><br><span class="dt">'+tm(h.updated_at)+'</span> '+(h.suspended?'<b style="color:#ff7a7a">凍結中</b> <button type="button" class="del" data-unsus="'+h.user_id+'">凍結解除</button>':'<button type="button" class="del" data-susu="'+h.user_id+'">凍結</button>')+'</div>'}).join(''):'<p>まだﾎﾑﾍﾟゎありません</p>'}
  catch(e){$('hps').innerHTML='<p class="msg ng">'+E(e.message)+'</p>'}}
document.addEventListener('click',async function(e){var t=e.target,a;
  try{
    if(a=t.getAttribute('data-del')){if(!confirm('この中身を削除する？'))return;await DB.adminDel(t.getAttribute('data-t'),t.getAttribute('data-tid'));alert('削除したょ');}
    else if(a=t.getAttribute('data-sus')){if(!confirm(a+' のﾎﾑﾍﾟを凍結する？'))return;var uid=await DB.userByHp(a);if(!uid)throw new Error('ﾎﾑﾍﾟが見つからないょ');await DB.suspend(uid,true);alert('凍結したょ');loadHps()}
    else if(a=t.getAttribute('data-susu')){if(!confirm('凍結する？'))return;await DB.suspend(a,true);loadHps()}
    else if(a=t.getAttribute('data-unsus')){await DB.suspend(a,false);loadHps()}
    else if(a=t.getAttribute('data-done')){await DB.setReport(+a,'done');loadReps()}
    else if(a=t.getAttribute('data-reopen')){await DB.setReport(+a,'open');loadReps()}
  }catch(err){alert(err.message)}});
function tab(s){ST=s;$('t-open').setAttribute('aria-selected',s==='open');$('t-done').setAttribute('aria-selected',s==='done');loadReps()}
$('t-open').onclick=function(){tab('open')};$('t-done').onclick=function(){tab('done')};
DB.me().then(async function(u){if(!u){$('msg').innerHTML='<a href="login.html">ﾛｸﾞｲﾝ</a>してね';return}
  if(!(await DB.isAdmin(u.id))){$('msg').textContent='このﾍﾟｰｼﾞゎ運営専用だょ';return}
  $('msg').hidden=true;$('main').hidden=false;tab('open');loadHps()});
</script>
